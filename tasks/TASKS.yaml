      <30 ms NOT met -> measured 240 ms (full-24-slab-build granularity on a 6-core box with 6 workers
      + 4 gen threads — cannot be 30 ms at that granularity; the metric did not exist on the before side).
      (2) 8 KB/col -> 5 KB NOT met -> measured 4338 -> 4258 B (-1.8%): zlib already crushes the zero slabs
      (the notes assumed the air storage was the bottleneck; it was not — the real before avg was 4338
      B, not 8 KB). The R50 build is NOT dominated by the air-cell scan (non-air cells + meshing + collision
