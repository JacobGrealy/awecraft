  notes: 'Blocks with transparency (e.g. leaves) must not occlude faces behind them.


    Current chunk.gd _faces skips a face if neighbor stab[nb]>0 (solid). Leaves use cutout/transparency and should be treated
    as non-occluding: a face adjacent to a transparent block (leaves, glass if added, etc.) must still emit even if surrounded.
    The bug: leaf interior in center of leaf cluster does not render when completely surrounded by leaf blocks, because each
    surrounding leaf is considered solid/occluding.


    Fix: distinguish opaque-solid vs transparent-solid. Use ktab/ttab or alpha/tint presence or explicit transparent list
    (leaves id=??, check Data.block) to gate occlusion. Stab should only occlude if neighbor is opaque-solid. Faces of transparent
    blocks themselves still emit per current cutout path.


