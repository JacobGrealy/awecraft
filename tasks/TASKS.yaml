- id: AC-0237
  title: window-scoped-generation
  source: user
  projects:
  - awecraft
  assignee: opencode
  priority: 2
  status: done
  labels: []
  created_at: 2026-09-06T23:15
  updated_at: 2026-09-06T23:15
  completed_at: 2026-09-07 08:05:00
  waiting_on: null
  parent_id: null
  notes: '1) User Story: As a player I want the world to fill in faster, especially while flying high
    or descending into deep caves, so streaming does not pay for terrain I cannot see. The AC-0234 vertical
    window already stops BUILDING the slabs outside the per-column kept set (their tower span + the player
    band); this task stops GENERATING them too: a column generates only the slabs the window keeps, and
    a slab the window slides back over is regenerated on demand (bit-exact, same world) before it is rendered.
    The deep interior and the sky cost nothing until they are actually needed.


    2) Technical Details: RESEARCH (done 2026-09-06, agent): the C++ generator (gdext/src/gen.cpp gen_flat)
    is a pure deterministic function of (world coords, seed) — coarse 4x8x4 noise fields (cave/ores/surface,
    441 lattice points each) + trilinear sampling + per-cell hash3i; no random walks, no cross-slab state
    — so a slab range regenerated later is BIT-EXACT (the genhash A==B guarantee). Cost structure per
    column: 7 field builds (fixed, lattice vertically bounded — shrinkable to the kept range) + the density
    scan (256 columns x y=H+11..1, ~47k tril+dens evals = THE BULK; already skips the sky above H+11,
    so the skippable share is terrain depth: ~55-60% at ground [the deep slabs below the band], ~90% in
    flight). AC-0216 is the proven horizontal analog (the optional skip arg: offscreen interior chunks
    skip the density scan — permanent, user-accepted); this is the VERTICAL analog with re-entry. PHASES:
    (0) measure — C++ timing breakdown in gen_flat (fields vs scan vs palettize, like the mesh ph_light)
    to confirm the scan share. (1a) SLAB-MASK REFACTOR (prereq, GDScript-only): replace the sorted-Array
    placeholder sets chunk.fog_slabs/low_slabs/cap_slabs (linear Array.has + sorted insert in the per-frame
    low-pick path and every _vwin_sync) with 24-bit int masks (+ a slab-to-instance-index table for low_instances)
    — O(1) bit ops, zero allocs; same model carries the new gen mask. (1b) CORE: generate_flat gains an
    si0/si1 slab range (default = full = bit-identical, the 14th-arg pattern); the mesh SNAP treats ungenerated
    slabs as SOLID for face culling (the face hides behind the opaque cap box — no z-fight, same outcome
    as the AC-0234 mask); chunk gains gen_mask (24-bit: which slabs are generated — ungenerated is NOT
    air: the mesh/low/fog paths must not drop placeholders on it); re-entry — a KEPT slab with no data
    enqueues a SCOPED threadgen task (data-only, si0/si1 = the kept range) instead of the AC-0234 build
    re-queue (extend _vwin_apply / _vwin_neighbor_sync: kept-and-ungenerated -> TG regen entry); neighbor
    RE-MESH on regen landing — an adjacent BUILT column that culled a face against absent-as-solid re-queues
    (the vwin_full_build flag pattern) when the landed data has cave air at the shared boundary (the boundary
    stays cap-covered for the few frames until it lands); TIER 0 (the player column) stays FULL gen (deep-mine
    fidelity for free); AC-0216 skip interplay: the lazy path keeps its own range (heightmap fill, no
    caves — permanent, unchanged). (1c) SAVE/LOAD: v4 codec is per-slab sections — ungenerated slab =
    absent section + a gen_mask flag in the chunk header (codec roundtrip probe required — the v1/v2 fl-fallback
