    text: '[impl] v2 CORRECTIONS (user, in-loop 2026-09-06) + DONE + VERIFIED 2026-09-06 (UNCOMMITTED
      - coordinator commits + closes). The two user-directed rules supersede the id-2 design: (1) NEVER
      replace a built mesh with black (keep-high for culling): a slab with a built HIGH mesh is never
      capped, never dropped, never re-meshed by the window - black caps cover NEVER-BUILT slabs only;
