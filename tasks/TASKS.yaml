  - bug
  created_at: 2026-09-11T07:50
  updated_at: 2026-09-11T07:50
  completed_at: null
  waiting_on: null
  parent_id: null
  notes: '1) User Story: As a player I want no engine errors when I am deep underground, so the game does
    not spam the log (and the harness does not get flaky light-box assertions) when the player is below
    y=0.


    2) Technical Details: FOUND during AC-0253 verification (the r16 player-fall flake landed the player
    at y=-12 in 2/2 runs, exposing it): godot/world/world.gd light_at() clips its light box to y<0 when
    the player is at y <= -8, so compute_light_split receives h <= 0 and calls PackedByteArray.resize(sz*h)
    with a non-positive size -> 225 engine p_size<0 errors per r16 run (0 in the pre-flake runs). The
    fix is a max(..., 1) clamp on the box height before the resize (lighting.gd:127-131 area - the compute_light_split
    call site / the h computation). Pure GDScript, no C++ on the path. VERIFY: an r16 run with the known
    player-fall flake forced (or a targeted harness check teleporting the player below y=0) shows 0 p_size<0
    engine errors; the normal r16/meshprobe/wprof gates stay green. NON-GOALS: no rework of the light-box
    math, no other files.

    '
