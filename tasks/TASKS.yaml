  parent_id: null
  notes: "1) User Story: As a player I want the held item/hand to always render on top of the world (Minecraft-style)\
    \ so the block in my hand is never hidden behind the ground.\n\n2) Technical Details: BUG regression\
    \ of AC-0067 viewmodel-always-on-top (user 2026-08-23). Held item/hand/block still occluded by environment\
    \ blocks instead of always-on-top. Re-investigate godot/player/player.gd viewmodel nodes (held_box,\
    \ held_sprite, held_fist, voxel tools via core/held_mesh.gd) actually have no_depth_test / depth-disable.\
    \ Was marked done with depth-disabled but user reports never worked in web+windows. Verify render\
    \ shows held always on top.\n\n3) Closeout (2026-09-11, coordinator, implemented directly while the\
    \ user collaborated):\n- Fix: no_depth_test = true on all viewmodel materials. AC-0067 had set only\n\
    \  depth_draw_mode = DEPTH_DRAW_DISABLED, which stops the depth WRITE (and moves\n  the viewmodel\
    \ to the transparent pass) but the depth TEST still ran, so the\n  held item was occluded whenever\
    \ it poked behind terrain:\n  * godot/player/player.gd: hbmat (held box), fmat (fist), tool voxel\
    \ material.\n  * godot/core/held_mesh.gd _base_mat(): source of the box/cross kind materials.\n  *\
    \ Sprite3D: the node's no_depth_test is a no-op in this build - the test had\n    to be disabled on\
    \ the MATERIAL (_vm_sprite_mat, also DEPTH_DRAW_DISABLED).\n  * Bonus bug found by the arm: the sprite's\
    \ material_override DISCARDS the\n    Sprite3D's internal texture binding, so the held item sprite\
    \ rendered as a\n    flat WHITE quad; _vm_sprite_mat now carries the tile (albedo_texture).\n- HELD_ITEM_SCALE\
    \ 0.70 -> 0.33 (held block AND item sprite) per user request.\n- Verification (wallshot harness arm,\
    \ xvfb/lavapipe, A/B with the pre-fix depth\n  state forced in place on the original materials; the\
    \ viewmodel hand is 0.3 m\n  BEHIND the wall face, the user's occlusion scenario):\n  * Block: before\
    \ block_vm_nonstone 68 (box fully occluded; ~68px = hotbar\n    frame sliver) vs after 16493 (whole\
    \ box on top of the wall).\n  * Item: before item_vm_cyan 0 (sprite occluded) vs after 191 (diamond\
    \ on top).\n  * Sanity: the wall stone fills ~91% of the frame in both runs.\n- Arm repairs (its assertions\
    \ were vacuous since AC-0067):\n  1) _is_stone/_is_cyan compared 0-1 float Colors against 0-255 thresholds\n\
    \     (c.r > 24 can never hold) -> /255 scale.\n  2) The \"0.5 m from the wall\" label was wrong -\
    \ the player stood 1.5 m out and\n     the viewmodel was never behind the wall; now the face is 0.4\
    \ m ahead of the\n     eye and the hand 0.3 m behind the face.\n  3) Meshing is worker-async: the\
    \ arm awaits main._await_world_build (the fixed\n     40-frame wait no longer guaranteed the wall\
    \ slab).\n  4) The forced pre-fix state must mutate the ORIGINAL material in place -\n     reassigning\
    \ material_override to a fresh resource is not reflected in the\n     rendered output in this build\
    \ (green-tint debug).\n  Evidence: .scratch/ac0097/ (4 PNGs + results.txt).\n- Built AweCraft-20260911-1254\
    \ (exe sha256 1f331b1b..., byte-identical on :8080).\n  The user's own in-game test of a build containing\
    \ the depth fix reported the\n  held item looks fine.\nDONE"
