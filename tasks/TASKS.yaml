  created_at: 2026-09-09T08:35
  updated_at: 2026-09-09T08:35
  completed_at: null
  waiting_on: null
  parent_id: null
  notes: '1) User Story: Anywhere water meets air I want the outside face visible - the top face seen
    from below, side faces seen from behind - so the water boundary is always readable, including underwater.
    (User request 2026-09-09.)


    2) Technical Details: Fluid materials render cull_back today, so faces pointing away from the camera
    are invisible. Set cull_disabled on chunk_lit_fluid.gdshader, fluid_anim.gdshader and the legacy StandardMaterial3D
    fluid material. Also shrink the AC-0036 underwater near-cull from 1.9 to ~1.2 blocks so the surface
    stays visible a short distance above the eye (only the face actually inside the head is hidden). 3)
    Implementation (agent, 2026-09-09): DONE - commit a8c9839. cull_disabled on chunk_lit_fluid.gdshader
    + core/fluid_anim.gdshader + the legacy StandardMaterial3D fluid material (chunk.gd _fluid_material)
    - water/lava boundary faces now render from every side (top face readable from underwater, side faces
    through/behind). The AC-0036 underwater near-cull shrunk 1.9 -> 1.2 blocks in both shaders: only the
    face actually inside the head is hidden, the surface a short distance above the eye stays visible.
    GOTCHA: GLSL comments are // not # (a # on the render_mode line = SHADER ERROR Tokenizer in every
    run). 4) Implementation follow-up (agent, 2026-09-09, user report: "weird z fighting / shadows flashing
    nonstop anywhere under water", screenshot at tasks/AC-0245/water-flicker-issue-screenshot.png): DONE
    - commit a8c9839. The "moving shadows" (only when the eye is underwater, shape-changed while the camera
    moves, stopped when it stopped) were the water sheet casting into the shadow map: the fluid surfaces
    shared the opaque ArrayMesh, so every water surface rode the opaque mesh instance and cast. The shadow-map
    footprint follows the camera, so the water shadow over the underwater floor kept re-shaping. Fix:
    the fluid surfaces now build into their own ArrayMesh on the fluid_instance (chunk.gd _assemble_slab)
    with cast_shadow = 0, and MINFO (world.gd) was restructured to match (opaque slot from the opaque
    mesh, fluid slots 1..3 from the fluid mesh). Bonus: this removes the double draw of every fluid surface
    (both instances drew the shared mesh). A back-face-static animation experiment was tried and REVERTED
    at the user request (the 300 ms surface flip is fine). GOTCHA: this engine build strips engine enum
    constants (GeometryInstance3D. CAST_SHADOW_OFF and BaseMaterial3D.SHADOW_DISABLED do not parse; the
    disable_shadow_cast render mode does not exist; FACE_FORWARD / FRONT_NORMAL are unavailable in fragment
    shaders) - use int assignment / derived math. Verify: syntax 0; meshprobe + R16 re-baselined (fluid
    surfaces no longer double counted); editslab MINFO variants byte-identical; battery ok incl. underwater
    + fluids; xvfb render (no shadow blobs underwater); EXE rebuilt + :8080 byte-match (product code).
    5) Implementation follow-up 2 (agent, 2026-09-09, user: "the water shadows still persist" after re-fetching;
    "issue happens when camera is above water too"; "only showing on terrain covered with water"; "maybe
    that next to air check is not happening"): DONE - commit ca41d3c, :8080 build AweCraft[20260909-1856
    ca41d3c] (title-screen tag, AC-0249). The moving shadows persisted after the section 4 mesh split.
    Probe-confirmed root cause: NO shadow map exists (main.gd sun.shadow_enabled = false) - the section
    4 shadow-map theory was a red herring (the mesh split is harmless but was not the cause). The real
    cause is z-fighting: cull_disabled (section 3) renders the water BACK faces exactly on the opaque
    underwater terrain (lake floor, cliffs), so the depth buffer flips the winner per block as the camera
    moves - a camera-motion-dependent blocky mottle on water-covered terrain, from above AND below the
    water. Fix (two parts): (a) C++ gdext/src/mesh.cpp emit_fluid - skip fluid faces toward solid neighbors
    (the same stab[nb] > 0 rule opaque blocks use in s_faces): the "next to air" check the user hypothesized
    - water emits faces only toward air/transparent (surface vs air, seen through leaves/glass), never
    toward the opaque floor/cliffs; (b) godot/core/fluid_anim.gdshader - cull_disabled reverted to cull_back
    (the root cause: back faces z-fighting the terrain); cull_back keeps the surface readable from above
    and the side faces from the water side. Trade-off: the underside of the water surface (seen from directly
    underwater) is no longer drawn (that back face was the z-fight source); the AC-0036 near-cull + blue
    underwater tint keep the underwater view clean. If the user wants the surface readable from below,
    revisit with per-face cull or a depth bias. Probe evidence (xvfb seed 44, subagent image compares):
    hiding all fluid removed the mottle (water related, not terrain); the cull_back probe removed it (cull_disabled
    is the cause); a two-angle compare proved the mottle is view-dependent (z-fight, not texture); final
    before/after - mottle GONE, floor clean, water normal. USER CONFIRMED 2026-09-09: "I got the tagged
    release and it is fixed". Gates: meshprobe ok:true match_rate 1.0 verts 321080; genhash (0,0) 80b904c0...
    held; battery 15/15 across two runs (run 1: 10 modes ok:true then the pre-existing AC-0246 native
    flake at the dnlight-to-oceanfill transition; run 2: the remaining 5 modes all ok:true; 0 SCRIPT/SHADER
    ERROR); EXE rebuilt + :8080 byte-match (zip + exe sha256 identical). 6) Implementation follow-up 3
    (agent, 2026-09-09, user rejected the section 5 trade-off: "removing the option to see the water surface
    from underwater is not an option, you just replaced one bug with another"; "not only the top from
    the bottom but any boundary where the water is against air"; "show/hide outside / inside faces based
    on camera position"): DONE - commit 9d8d691, :8080 build AweCraft[20260909-2141 9d8d691]. The section
    5 cull_back fix traded the mottle for a water surface invisible from below - not acceptable. New design
    (user-specified): two-pass camera-side culling - each water/lava boundary face is drawn by exactly
    one of two passes, the pass whose side the camera is on, so every water-air boundary (the surface
    from above AND from below, each shore/side face from the air side AND the water side) stays two-sided
    with no coincident fragments. CRITICAL FINDING (probe series, xvfb seed 44, byte-identical frames):
    the engine render_mode cull options are UNRELIABLE in this build - both cull_back and cull_front render
    extra sides (the inward pass behaved like cull_disabled); the mottle was the surface sheet front+back
    drawn by two draw calls with a per-pixel depth tie (the water-vs-terrain coincidence theory was wrong
    - the mottle region is a flat 126.875 sheet over an undulating floor). Fix: explicit per-fragment
    camera-side selection - both passes render_mode cull_disabled + the geometric face normal from screen-space
    derivatives (cross(dFdx(world), dFdy(world))) vs the direction to the camera (u_cam_pos): fluid_anim.gdshader
    (OUTWARD) discards the inside-side fragment, new core/fluid_anim_bf.gdshader (INWARD) discards the
    outside-side fragment - the exact complement, each boundary face rasterizes once per frame. Wiring:
    two surfaces per animated fluid category on the fluid instance (chunk.gd _assemble_slab, same arrays);
    data.gd fluid_anim_bf_mats (mirrored _fluid_anim_mat + apply_atlas re-point); main.gd u_srgb_pre (startup)
    + u_cam_pos (per frame) and chunk.gd set_underwater u_underwater pushed to both material sets. AC-0036
    near-cull kept in both passes (the surface above the head in 1-block pools stays hidden by design;
    deep water 2+ blocks shows the surface from below). Gates: genhash (0,0) 80b904c0... held; meshprobe
