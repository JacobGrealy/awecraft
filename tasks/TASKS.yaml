    updated_at: null
    text: '[user] I think we need to make it so after the first load the chunks are streamed in / out rather than it all happening
      at once. As the player crosses chunk boundaries it should kick off a separate parallel process and/or some kind of process
      that happens across many updates doing small amounts of the loading / unloading without interrupting gameplay. This
      relates to AC-0034. For this one, let''s make the first take just coming up with a plan of attack that I can review
