- id: AC-0247
  title: pool-meshinstances-for-slabs
  priority: 2
  status: open
  notes: '1) User Story: As a player flying forward I want slab meshes to recycle without constant alloc/free
    so main stays smooth while waves sweep out.


    2) Technical Details: godot/world/world.gd + chunk.gd. Replace per-slab MeshInstance3D create/free
    (fog 16x16x16, low 4x4x4, high 16x16x16) with a pool. Pool checkout on _fog_ensure/_low_place/_high
    handoff, checkin on _fog_drop/_low_drop/free at r+2. Keep pool per World, prewarm small. Also pool
    the raw slab arrays (4096 per slab) — reuse buffers on gen dispatch/value-copy instead of alloc+copy
    each time, return on handoff/free. Also pool the column objects themselves (the per-column Node holding
    c.data + slab meshes) — reset and recycle instead of instance/free per column when streaming in/out
    at r+2.

    Verify via profiler: allocations down, Process time flat while flying far forward; no leak when column
    freed.


    3) Implementation (agent, 2026-09-10): DONE - commit 0e6c227. Code (+408/-49, world.gd + chunk.gd;
    NO C++): THREE POOLS per World (prewarm small, grow-on-demand): (a) MeshInstance3D pool (_mi_pool,
    prewarm 32) - the high-slab/fluid/flora attaches (chunk.gd _assemble_slab family) + the low-slab attach
    (_low_place_slab); checkin on every drop/replace/free; checkout resets to fresh-instance defaults
    (mesh=null, material_override=null, cast_shadow=1, visible=true, identity) so a recycled fluid/culled
    instance never pollutes an opaque checkout; checkin drops the mesh REFERENCE only (the per-slab ArrayMesh
    frees by refcount exactly as today). (b) MultiMesh pool (_mm_pool, prewarm 8 [mmi,mm] pairs) - the
    fog + cap placeholders (per-chunk MultiMeshInstance3D over the ONE shared pre-baked box mesh + shared
    material); checkin zeroes instance_count but KEEPS the capacity buffer (the per-instance realloc is
    what pooling removes); the shared mesh is never freed. (c) COLUMN OBJECT pool (_col_pool, prewarm
    16) - on the r+2 recenter evict + the face FIFO free, the column is RESET IN PLACE (_pool_reset: every
    declared state field - data/fl/gens/top, mesh+collision+light, candidate/band hysteresis, fog/low/cap
    instance lists+masks, the vwin state, the gen_keep/mask, the 24 Slab objects reset in place (all 10
    fields each), and the perf arrays re-sized to slab_n() - the subagent caught a real OOB there during
    r16) and returned to the pool; on spawn, checkout + identity re-set. DESIGN ADDITION: col_gen (chunk.gd)
    - a logical identity token bumped on every checkout: Godot 4 instance_id is FIXED per object, so a
    pooled reuse would blind every inst-based staleness check (reachable at 215 m/s flight); captured
    at ALL dispatch sites (TM, edit, low, all 5 threadgen_enqueue call sites incl. the null-result retry)
    and checked at ALL handoffs (threadmesh_handoff, threadgen_handoff, _low_handoff) - a mismatch drops
    the stale result (safe). SLAB RAW-ARRAY POOL: honest partial, kept on alloc: (i) the TM slab_copy
    is C++-side (AweMesh.slab_copy) - pooling it would need a C++ change and the measured GD copy cost
    is higher than the C++ copy (perf-driven keep); (ii) the save-queue copy lifetime spans the compaction-defer
    re-queue (the longest slab-buffer lifetime in the tree) - payoff too small. VERIFY (the subagent ran
    the gates; the coordinator AUDITED the diff this cycle per the users 2026-09-10 process note (do not
    re-run what the subagent already ran): the reset field enumeration matches every declared column state,
    the col_gen guards sit at every handoff): genhash (0,0) 80b904c0... exact; meshprobe ok:true match_rate
    1.0 verts 321080; r16 ok:true with the falsy set identical (air/height/immediate pre-existing) + spin
    invariant + low_sync gate + the leak A/B HEAD-vs-POST 272=272 (no new leaks; the coordinator cross-checked
    the POST 272 in an independent spot run); wprof ok:true - MESHATTACH avg 0.1 (87/180 frames, max 4.0),
    frame avg 4.4 flat vs the pre-change 4.2; battery genhash+interact+editsnap+range ok:true; 0 script/shader
    errors. STILL ALLOCATES: the per-slab ArrayMesh vertex/index data (the C++ build_accs/low_emit output
    - mesh-DATA pooling needs the C++ emit side), the collision StaticBody3D + ConcavePolygonShape3D,
    the OccluderInstance3D, the snap_rings nbs snapshots. SHIPPED as AweCraft[20260910-1328 0e6c227] (:8080
    byte-matched, zip 9eaa52bb...).'
  area: perf
  effort: M
  depends_on: []
- id: AC-0253
  title: per-slab-air-bitset-for-mesh
  priority: 2
  status: open
  updated_at: 2026-09-11T07:51
  notes: '1) User Story: As a player I want meshing to skip air checks fast so low at 4x4x4 and high at
    16x16x16 build quicker while flying.


    2) Technical Details: godot/world/generator.gd + world.gd + chunk.gd + gdext/src/mesh.cpp. On gen
    fill of 4096 per 16x16x16 slab, build 512-byte bitset (1 bit per block solid/air) and store alongside
    c.data[si]. Greedy walk checks bitset first for air/solid (fast path), only palette-decodes on emit.
    Enables instant all-air/all-solid early outs and neighbor checks if gen ahead. Verify via profiler:
    mesh ms per slab down vs baseline, no extra alloc spike.


    3) Implementation (agent, 2026-09-10/11): DONE. The slab entry gains an optional "bs" field: a 512-byte
    PackedByteArray, bit k (byte k>>3, bit k&7, LSB-first) set iff cell k (flat (y<<8)|(z<<4)|x) is non-air;
    nz already equals the solid count, so bs is its per-cell form; a missing/short bs takes the full pre-AC-0253
    decode path everywhere (graceful). It is built in the SAME nz scan that already counts solids (no
    second pass) in both gen.cpp palettize_slabs and chunk_io.cpp palettize_flat, rides the entry as a
    plain dict field through every value copy (slab_copy/slab_set do true byte copies; slab_set flips
    the edited cell bit), and decode_slabs is deliberately untouched, so disk-loaded slabs have no bs
    until re-palettize/edit (the fallback path covers them - a later ticket can build bs at load). WHAT
    IT BUYS (measured, 13 interleaved meshprobe A/B runs vs the pre-ticket .so): the low avg emit is -13
    to -20% (130 -> 103-113.5 us/slab: pass 1 is a solid-bit COUNT per sample - the >half-air reject with
    zero decode; pass 2 palette-decodes only the kept samples in identical float order, so the A/B pair
    stays 8/8; neighbor slabs contribute solid mask only), all-air slabs early-out instantly (nz == 0),
    and the neighbor ring decodes bs-first. The HIGH walk initially got the bitset-first face tests too
    - and MEASURED 10% SLOWER (0.330 -> 0.3635 ms/slab; faces phase 0.281 -> 0.456 ms/build): the terrain
    is ~75% solid, so the extra bit test on the SOLID path (the common case) taxed more than the saved
    id load on the air path (25%). Per the users decision (2026-09-11) the high-walk bit tests (s_faces
    / s_is_interior) were REVERTED to byte-identical pre-AC-0253 code and the now-dead snap_sol solid
    mirror deleted entirely (grep-verified zero references); the high walk is back at 0.318 ms/slab (inside
    the old 0.311-0.343 range, below the old median) while the low-emit win stays. ALLOCS: steady +512
    B per slab entry (~24 KB/chunk), value-copied with zero GDScript per-byte work; wprof MISC flat 0.9
    -> 0.9-1.0 (no alloc spike). GATES (agent ran; coordinator diff-audited the bs build + AvgSrc + the
    revert diff - s_faces/s_is_interior confirmed byte-identical to HEAD, zero snap_sol refs; staged .so/.dll
    md5-verified): genhash exact (0,0) 80b904c0... and 25/25 lines byte-identical old vs new; meshprobe
    ok 1908/32 + A/B 8/8 + verts_gd == verts_cpp; r16 ok (falsy set exactly the pre-existing trio; note:
    the faster low band shifted the r16 build/flight interleaving - queue_max 136->1, catch_up 0->678
    - and the known player-fall flake then tripped a PRE-EXISTING latent GDScript bug, filed as AC-0255;
    4 timing-sensitive statistical sub-gates went false in that run but are not part of the arm ok expression
    - watch item); wprof ok, recon 0.0, all 9 stages flat; battery genhash+range ok (note: the first battery
    run was invalid - shell quotes leaked into AWECRAFT_BATTERY and both arms BATTSKIPped for a vacuous
    ok; the clean-env re-run is the evidence - a one-line strip() hardening in _run_battery is suggested);
    0 script/shader errors. SHIPPED as AweCraft[20260911-0749 09ec238] (:8080 byte-matched 64c4e98d...).'
