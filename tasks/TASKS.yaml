  notes: '1) User Story: I fly at 4x speed and the fps tanks to ~20. I thought that after AC-0250 (which
    removed the priority cone and the low-LOD main-thread sync fallback) the drops would go away and I
    would only see more pop-in; the fps still tanks, which should not happen if the pipeline is properly
    multithreaded and spreads the main-thread work over multiple frames. I want a per-stage breakdown
    of where the main-thread time in the world generation/streaming pipeline goes (drain dispatch, gen
    handoff, mesh build/attach, the face-block light cascade, low-lane attach, fog, IO commit, recenter/rebuild,
    per-chunk mesh-instance attach, rescore) so I can see which stage eats the frame and fix it with data,
    not guesses. I want to read it live (in-game overlay while flying) AND as a repeatable headless flight
    dump at the repro speed (4x).


    2) Technical Details: CORE (godot/world/world.gd) - a per-stage timing struct, MAIN-THREAD-ONLY, pre-allocated
    (ring buffer, no per-frame allocation, no new locks on the hot path): wrap each main-thread stage
    of the world pipeline in Time.get_ticks_usec() pairs: the drain pass (_drain_build_queue), _low_step
    (attach + in-r lane + slab wave), the worker-result handoffs/attaches (TG + TM, including the face-block
    light cascade / face-cache refresh - isolate the cascade if separable), the IO commits (_io_write_commit
    + disk-read handoffs), the recenter/rebuild queue walk, the rescore step, the per-chunk mesh-instance
    create/attach (the AC-0247 suspect - isolate if separable), plus a MISC catch-all so the stage sum
    + misc reconciles against the frame total. Aggregation: a rolling window (~3 s / ~180 frames) per
    stage: p50/p95/max/avg + frame count; expose as world.profiler (stage -> stats) plus the frame total.
    OVERLAY (godot/ui/console.gd, the AC-0244 debug overlay) - a compact stage table (name, p50, p95,
    max, ms/frame) plus frame ms/fps and the TG/TM/low in-flight occupancy; refresh ~every 500 ms. HARNESS
    (godot/scenes/harness.gd) - a NEW AWECRAFT_LOGIC=wprof arm: spawn + settle, then a sustained 4x flight
    (the _fly_phase teleport-drive pattern from the r16 arm; 15-20 s), read world.profiler at the end
    (steady state: sample the window after the first ~5 s to skip settling); the RESULT JSON carries the
    per-stage stats + fps/frame ms + the occupancy; gates: the arm completes, every major stage has non-zero
    samples, 0 errors (an evidence arm - no performance gates). Add the arm to the arm table. NON-GOALS
    - instrument-ONLY ticket: NO behavior/scheduling/pacing change to the pipeline; NO stage fixes (the
    fix tickets follow the data); NO C++ (gdext/ untouched). GATES: genhash (0,0) 80b904c0e5f085eef1e839459058c706
    exact; meshprobe ok:true verts 321080 unchanged; the r16 arm ok:true UNCHANGED (the instrumentation
    must be schedule-transparent - its existing gates, incl. the spin invariance, must hold); the wprof
    arm ok:true with plausible evidence (the 4x flight frame ms consistent with the fps proxy; the stage
    sum + misc ~ the frame total); battery genhash+range ok:true; 0 script/shader errors. KNOWN SUSPECTS
    (hypotheses to confirm/refute - from code comments, NOT conclusions): the face-block light cascade
    on handoff (~1.2 s class), the per-dispatch strip/nbs work (30-50 ms class), the per-slab MeshInstance3D
    create/attach, the in-r low budget (up to 8 ms/frame), the blob IO commit, the burst handoff.


    3) Implementation (agent, 2026-09-10): DONE - commit fdee3a1. Code (instrument-only, +506/-1, zero
    behavior/scheduling change): world.gd - a per-stage timing ring before _process (180 frames x 10 stages,
    pre-allocated, main-thread-only, no hot-path allocation or locks): the TOP-LEVEL DISJOINT partition
    DRAIN (_drain_build_queue) / LOW (_low_step) / HANDOFF (threadgen_poll + threadmesh_poll) / IO (io_poll)
    / RECENTER (_recenter_slice) + MISC = the exact frame remainder (reconciliation 0% by construction,
    a negative-MISC guard misc_neg_max_us); sub-stages (attribution detail, not in the partition): FACELIGHT
    (_eff_landed face-block cascade - ISOLATED), RESCORE (_rescore_step - a DRAIN subset), MESHATTACH
    (the per-slab instance attach: _low_place_slab / _fog_ensure_slab / _cap_ensure_slab + chunk.gd _assemble_slab
    - the AC-0247 suspect - ISOLATED); exposed via the world.profiler getter (rolling p50/p95/max/avg
    + active frames per stage + the tg/tm/low occupancy; stats recomputed on read only). chunk.gd - the
    _assemble_slab attach timing into the world ring. console.gd - the live WORLD-PIPELINE table in the
    AC-0244 debug overlay (backtick/F3): 9 stage rows (sub-stages indented) + the FRAME row (p95 ms +
    approx fps) + the occupancy, refreshed ~every 500 ms while open. harness.gd - the NEW standalone AWECRAFT_LOGIC=wprof
    arm (NOT in the battery): r16-style settle + a 17 s sustained 4x flight in 3 segments (Engine.max_fps=60
    pacing so headless gets true 16.7 ms frames; the ring is read after each segment) - RESULT JSON with
    the per-stage tables + reconciliation + the flight evidence; gates: completes, the major stages have
    non-zero frames, the frame avg is non-vacuous, recon <= 10%, no negative MISC, 0 errors. VERIFY (coordinator,
    independent runs): genhash (0,0) 80b904c0... exact; meshprobe ok:true verts 321080 in BOTH of 2 runs;
