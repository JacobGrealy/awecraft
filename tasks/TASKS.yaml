- id: AC-0123
  title: multiplayer-client-server-research-plan
  source: user
  projects:
  - awecraft
  assignee: opencode
  priority: 2
  status: open
  labels: []
  created_at: 2026-08-26T07:26
  updated_at: 2026-08-26T07:26
  completed_at: null
  waiting_on: null
  parent_id: null
  notes: 'User story: As a group of up to 8 players I want to share a solar system of spherical planets
    that I can join anytime — even if no one else is on — with no anti-cheat, LAN/Tailscale now and Steam
    Networking later.


    High level what we want:

    - Different planets at once: mine on home R=4000 while friend is on desert planet R∈[2000,8000] —
    both correct.

    - Always in right place: pos just works ground/tower/orbit/other planet, no glitch crossing face edge
    or jumping.

    - Only load around me: ~400 chunks around me (114m horizon at R=4000), not everyone else''s.

    - Jump per ship: solo jump whenever at relay — don''t wait for all 8. Same ship or all ships together
    can co-jump and split fuel cost (economic incentive).


    Technical details:

    - Client-trusted (no anti-cheat): each client generates/meshes its own ~400 chunks from seed+R+face+cx+cz
    (same as single-player P1a), handles its own physics (up=normalize(pos-C)). Server never generates
    voxels.

    - Server is thin persistent relay + save: headless Godot ENet holds planets[{R,orbit}] + edits{planet_id:face:cx:cz}
    + relay graph + player planet_id, forwards block edits + pos (~KB/s). Stays up zero-players (save
    on disk) so anyone can join anytime.

    - Per-planet origin: planet-local C=(0,0,0) while landed, system (0,0,0)=star while in flight, relay
    jump = swap planet_id. Same core/origin_shift.gd as planet plan §9. Per-player per-planet recenter
    (band_buckets per player), dedup if sharing planet.

    - Hosting now: LAN 192.168.0.224:4242 or Tailscale 100.x:4242 direct ENet (no port-forward, internet
    via Tailscale overlay). Later: Steam Networking relay+NAT punch (no public IP). Queued after solar
    system, not needed for P1a/P1b.

    - Target 8 players, per-ship jump (no server-wide ready-check; group co-jump splits cost). Research-only:
    no code until AC-0143..AC-0145 proven. Ref: tasks/AC-0042/AC-0042-plan.html §14.

    '
  comments: []
