    updated_at: null
    text: '[coordinator] DONE + SHIPPED 2026-09-03. Dithered fade (GDScript/shader, no C++/.so touched):
      Screen-space 4x4 Bayer checkerboard in the 5 chunk shaders - fragments beyond dither_start(R) =
      0.45*(R+1)*16 m from the player are discarded per Bayer threshold; fade ramps 0->1 up to dither_end(R)
      = 0.99*(R+1)*16, so far chunks dissolve in as a checkerboard that fills in as they get closer. Complements
