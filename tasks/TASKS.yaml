  notes: "1) User Story: As a player or dev I want an in-game console opened with backtick that lets me\
    \ type commands like give, so I do not need hidden key combos.\n\n2) Technical Details: In-game debug\
    \ console: toggle with backtick/tilde (or F3), overlay TextEdit+log, command dispatch to Debug.* (give,\
    \ tp, time, etc.), handles input focus vs player look. Followed by AC-0122 moving V/H/J/K into it\
    \ and AC-0185 moving pause to Esc. Verify toggle, command executes, log scrolls.\n\n3) Implementation\
    \ (agent, 2026-09-08): DONE - commit e385d2e.\n- godot/ui/console.gd (new): CanvasLayer(30) overlay\
    \ with a RichTextLabel log\n  (green, scroll-following, plain text) plus a LineEdit command line;\
    \ commands\n  give/tp/time/fly/setblock/block/spawn/seedinv/help/quit dispatch to the\n  Debug autoload;\
    \ auto-closes whenever Game.mode leaves play (covers the\n  quit-to-menu flow).\n- player.gd: a new\
    \ _input handler toggles the console on backtick/tilde or F3\n  (marked handled so the key never reaches\
    \ the line); while Game.console_open\n  the game input is gated - LMB, the V/H/J/K/E/P/1-9 hotkeys,\
    \ pad buttons and\n  every polled InputMap action (move/jump/sprint/fly/time/debug) are ignored\n\
    \  so typing never steers; physics (gravity, falls, swimming) keeps running.\n- Game autoload: console_open\
    \ flag + console ref; main.gd _create_game_nodes\n  creates the console node.\n- harness: AWECRAFT_LOGIC=console\
    \ arm asserts the whole contract: backtick\n  opens (focus lands on the line, mouse visible), typed\
    \ give 126 5 lands 5\n  items, a 60-command burst grows and scrolls the log, typed time 0.6 applies,\n\
    \  a held W does not move the player while open, backtick closes (mouse\n  recaptured), and W moves\
    \ the player again. ok:true.\n- Godot 4.7 input gotchas (probed in isolation): the TextEdit class\
    \ no longer\n  exposes text_submitted (LineEdit does); an injected InputEventKey needs its\n  unicode\
    \ set or it types nothing; parse_input_event queues the event object\n  itself, so a press and a release\
    \ on one object rewrites the queued press; a\n  LineEdit without keep_editing_on_text_submit stops\
    \ accepting keys after the\n  first ENTER; the headless DisplayServer cannot CAPTURE the mouse.\n\
    - Verify (all green): syntax 0 Parse Errors; console arm ok:true; SMOKE\n  battery ok (player arm\
    \ values at baseline: horizontal 2.82, jump peak\n  138.43); gamepad ok (all pad tests); save_test\
    \ ok; quitmenu ok with 0\n  SCRIPT ERROR. EXE rebuilt after this commit."
