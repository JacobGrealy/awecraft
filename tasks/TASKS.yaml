  notes: '1) User Story: As a developer and as the agents working this repo I want a single stable API
    for interacting with the task list so concurrent agents and editors stop clobbering, re-wrapping,
    and silently losing entries in tasks/TASKS.yaml (the 2026-09-10 clobber saga: a coordinator revert
    erased a user-filed ticket, two agents and an editor rewrote the file with different YAML wrappings,
    and the other-chat agent lost three tickets and had to recreate them).


    2) Technical Details: Make tasks/scripts/tasks.py (currently read-only: next/list) the SINGLE WRITER
    API for tasks/TASKS.yaml. Subcommands: add (a new intake entry: id auto = next free AC-NNNN, title,
    source, priority, status, labels, notes from a file or stdin), queue (add --at head|after <id>|end
    / remove <id> / list), note (append text to an entrys notes), set (status/priority), show <id>, and
    the existing next/list. WRITER DISCIPLINE (the point of the ticket): (a) an exclusive file lock (fcntl.flock
    on a tasks/.tasks.lock sidecar) held across the entire read-modify-write; (b) atomic write (temp file
    in the same directory + os.replace); (c) a deterministic canonical dump (yaml safe_dump, sort_keys=False,
    width 100, allow_unicode=True, entry key order preserved: id, title, source, projects, assignee, priority,
    status, labels, created_at, updated_at, completed_at, waiting_on, parent_id, notes) so the file is
    SELF-CONSISTENT - any API write leaves unchanged entries byte-identical (idempotent); (d) a POST-WRITE
    validation: safe_load the result and assert the intended change applied and EVERY other entry is data-identical
    pre/post (abort + restore the original file on any mismatch). SCHEMA PRESERVATION: the other-chat
    agent uses a RICHER schema (a per-entry comments: list of {id, author, text}; pyyaml double-quote
    style) - the API must round-trip ALL fields, not just the house-schema ones. FIRST WRITE: a one-time
    normalization of the whole file to the canonical style is acceptable (from then on every writer uses
    the API, so it stays stable). DOC: add one line to the TASK format section of AGENTS.md: all agents
    MUST mutate the task list only via python3 tasks/scripts/tasks.py <cmd>; raw edits to tasks/TASKS.yaml
    are forbidden. VERIFY (no godot gates - no game code change): (1) a no-op write leaves the file byte-identical
    (idempotence); (2) add + note-append + queue-move round-trip all entries on a throwaway copy; (3)
    a concurrent writer is blocked by the lock (two processes: the second waits or fails clean, never
    a partial file); (4) all 254 current entries are data-identical pre/post the first normalization write;
    (5) tasks.py next still works with the right queue head. House-process formality: ./build_windows.sh
    + :8080 byte-match (the game is unchanged - the build keeps the serve contract honest). NON-GOALS:
    no server/daemon (CLI only), no schema migration (unknown fields are preserved as data), no other
    files beyond the AGENTS.md line, no game code, no C++.


    LOCK-SPOTCHECK: note append blocked while lock held, then applied.


    3) Implementation (agent, 2026-09-10): DONE. Files: tasks/scripts/tasks.py (CLI: add / set / note
    / queue add|remove|list / show / next / list, plus the legacy status + comment), tasks/scripts/tasks_lib.py
