- id: AC-0248
  title: prewarm-pools-for-streaming
  priority: 3
  status: open
  notes: '1) User Story: As a player starting or flying fast I want pools already warm so first streaming
    burst doesn''t hitch.


    2) Technical Details: Depends on AC-0247 pools. On World ready, preallocate mesh instances, 4096 slab
    arrays, and column shells for ~ring (e.g., 9-16 columns * avg slabs). Keep grow-on-demand. Verify
    no extra alloc spike on first fly-forward in profiler.

    3) Implementation (agent, 2026-09-10): DONE - commit e2e4b0c. Code (+224/-12, world.gd + harness.gd;
    no C++): the pools now prewarm to the STREAMING DEMAND instead of the small fixed counts: the recenter
    ring is provably exactly 2R columns (the lattice points with (dx-1)^2+dz^2 <= R^2 that were outside
    dx^2+dz^2 <= R^2 - verified 8@R4, 32@R16, 100@R50, matching the circle_count comments), so _pool_targets_for(R)
    prewarms 2 rings of COLUMNS (max(2*ring(R), 16) - 64 at R16, 200 at R50), their MI demand (slabs-per-column
    from the code: everything below the sea + the surface slab + fluid/flora headroom = 10 -> 640 at R16,
    2000 at R50), and their fog+cap MM pairs (2 per column -> 128 at R16, 400 at R50); the AC-0247 minimums
    stay as floors. Runs in World._ready + a TOP-UP in recenter() (a cached target keyed on render_radius
    makes the steady state three int compares) - the top-up is required because every radius change (the
    slider, the boot apply_world, the harness arms) applies the radius AFTER _ready and ends in a recenter.
    One-time cost measured via perf_pool_prewarm_ms: 0.8 ms at R4 ready, 3.7 ms at R16, 6.7 ms cumulative
    worst case at R50 (incl. a 2.1 ms refill after the burst drained the pool - the depth self-heals).
    POOL GROW COUNTERS (perf_pool_mi/mm/col_grows_n) + the r16 pool evidence block (_pool_snap at build-settle
    / fly4 / fly50 boundaries): the initial burst grows the pools ONCE by design (col 868, mi 5498, mm
    804 - the first burst fills the WHOLE 797-column circle, far past the 2-ring prewarm, which is exactly
    what the ticket scopes), and the sustained fly-forwards show EXACTLY 0 growths (fly4 8 s @ 4x, fly50
    2 s @ 215 m/s; steady_zero_ok true) - steady state fully recycles (the r+2 evict check-ins feed the
    ring check-outs); end sizes mi 2686 / mm 167 / col 99 against 797 live columns (4.33 live MI/col once
    highs replace lows). SLAB RAW-ARRAY POOL: still out of scope (the AC-0247 reasons: the slab_copy allocates
    inside the C++; the GD per-byte copy measured 98 us/4096 B vs ~9 us C++ - a net CPU regression). VERIFY
    (agent ran; the coordinator audited the diff): genhash (0,0) 80b904c0... exact; meshprobe ok:true
    1908/32 + the avg A/B pair 8/8; r16 ok:true the falsy set exactly the pre-existing trio + spin invariant
    + low_sync gate + the pool evidence above; wprof ok:true flat (LOW avg 3.0 / p95 8.2, frame avg 4.6
    - within headless noise); battery genhash+range ok:true; 0 script/shader errors. SHIPPED as AweCraft[20260910-2057
    e2e4b0c] (:8080 byte-matched, zip d74b9d1b...).'
