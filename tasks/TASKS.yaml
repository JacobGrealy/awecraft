  - id: 3
    created_at: '2026-09-02T06:40:00.000000'
    updated_at: null
    text: '[coordinator] BUGFIX 2026-09-02 (user-reported regression): breaking a block showed BLACK LINES
      on that chunk for a few seconds. Root cause: the scoped edit remesh emits opaque faces via the plain
      per-face path whose UVs are in the PLAIN-atlas space (make_ctx: Data.ATLAS_PX + Data.block_rect),
      but the opaque material is always _get_mat("opaque", ms.tex) = the MERGED atlas (chunk.gd:1957)
      — plain-space UVs sampled on the merged texture = wrong texels until the wave''s full (merged-UV)
      rebuild. Fix (surgical, chunk.gd apply_edit_accs only): pass a plain-ms (tex:null) to _assemble_slab
      so the scoped opaque material uses the plain atlas, matching its plain UVs (cutout/flower/fluid
      already used plain materials — only opaque was mismatched). Verified: NEW editmat probe ok:true
      opaque_mat_is_plain:true merged_tex_present:true (3320 UVs in [0,1]); A/B (revert that line -> opaque_mat_is_plain:false);
      render 1 shot = no black lines; editfront ok:true (break 34.0/place 48.7 ms <50, 0 drops); SMOKE
      ok; genhash 25/25 IDENTICAL (x2 + vs AC-0187 ref); lodswap ok:true; HEAVY boundary r4 x2 p95 29/28
      (in band) + perf r4 p95 23 + fog_ok; G0 0 SCRIPT ERROR. See tasks/AC-0187/AC-0187-fix-blacklines.html.'
