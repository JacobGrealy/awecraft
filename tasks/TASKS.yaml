  notes: '1) User Story: As a player moving forward a little inside a chunk I want to stay at 60fps, not
    drop to 5fps.


    2) Technical Details: Even with AC-0207 strip, AC-0210 flood, flat cache and C++ mesh landed, tapping
    forward or looking around inside a chunk at R16 still tanks to 5fps (not generation off-chunk). Root
    is queue breadth when moving forward - ahead band scores and queues many columns per step plus palette
    reads. Fix: limit per-frame generation/mesh builds on small moves, debounce requeue of same ahead
    ring, ensure camera-only moves do not requeue. Verify: R16 tapping forward or looking around inside
    chunk stays 60fps, walk p95 recovers, no pop.'
