    branch (the terminal c.low_failed mark STAYS - it is wave-advance logic, not fog); (4) the C++ low
    handoff all-air branch (same). CRITICAL CARVE-OUTS in _low_fog_for: _vwin_neighbor_sync (the data-landing
    span re-sync) and the in-r order-gate invalidation (_low_inr_invalidate) are NOT fog work - they run
