  waiting_on: null
  parent_id: null
  notes: '1) User Story: The chunk loader currently biases loading toward where the player looks (the
    "priority cone"), and when the low-LOD worker pool is full it stalls the game thread to build a low-detail
    chunk on the fly. Both are legacy crutches of the fog->low->high era: the cone exists so the area
    ahead fills first, which the upcoming satellite far-LOD replaces outright (the far zone fills instantly
    from the terrain-top height grid), and the main-thread fallback is a leftover from before the low
    pass was threaded. I want both removed so the loader orders chunks purely by proximity (under the
    feet, then the sim radius, then everything else by distance), the game thread never stalls on a low
    build, and the whole look-tracking rescore machinery (yaw-snap refresh, amortized queue re-stamps,
    the spin tests) disappears. (User request 2026-09-10: "I think we need to remove the priority cone.
    We should also remove the fall back where low lod is constructed on the main thread.")


    2) Technical Details: CONE REMOVAL (godot/world/world.gd, the AC-0233 / AC-0239 4-tier system) - tiers
    collapse 0/1/2/3 into 0 (under you), 1 (sim radius, Chebyshev <= band0_r), 2 (rest, taxi-ordered |dx|+|dz|).
    Remove: TIER_CONE_DOT (~382); the dot branch in _tier_of (~435); the look components of _pool_key
    (~415); _look_dir + _refresh_look_dir (~5044) and its drain call site (~5427); the look-snap _rescore_kick
    (~5059). KEEP the re-stamp amortization and the kicks for the sim slider (~2819), the recenter rebuild
    (~6879) and the column cross (~7312) - a slider move is now the only rare event that needs re-stamps.
    _low_pick (~2131): drop the f20 (ahead early-exit) / f21 (cone-behind) logic - order becomes ring1
    (f1) then rest by taxi rank. Order gate: "tier >= 2" becomes "outside the sim radius" (expression
    unchanged, semantics documented). Harness (godot/scenes/harness.gd): re-scope the AC-0233 spin-180
    reprioritize probe (~8310-8465) into the removal regression - after a 180 deg look flip the queue
    tier set must be INVARIANT (look no longer affects order at all); the still-valid AC-0233 gates (tier-0
    fall-through ~6666, dirty-edit immediate ~6704) stay. FALLBACK REMOVAL (world.gd, AC-0236 part 2)
    - _low_dispatch_slab (~1890): remove the LOW_TASK_CAP -> sync branch (~1893-1895); a capped dispatch
    becomes a NO-OP with a new return value (2): the slab stays PENDING and the in-r pass or the far wave
    re-picks it next frame (the existing stale-drop semantics - no re-queue logic). -1 now means null
    slab ONLY (caller does air bookkeeping, not a build). Call sites ~2412 (_low_inr_step) and ~2506 (_low_step
    slab wave): the capped verdict must not call _low_build_slab and must not count as in-r progress.
    low_sync_fallbacks_n (~652, already harness-read) stays and must now read 0 forever - that is the
    regression gate. GATES: genhash (0,0) baseline 80b904c0e5f085eef1e839459058c706 stays green (pure
    scheduler change, no world-gen change); meshprobe unaffected (no C++ change); battery at least genhash
    + range (the long-flight queue stress); TASKS.yaml YAML round-trip after the edit. RELATION TO THE
    SATELLITE FAR-LOD: this ticket leaves the low path (in-r lane, far slab wave) alive; the satellite
    ticket later gates it off behind the revert const and takes the far zone with the top-grid heightfield.
    The satellite design forks (trigger, detail radius) are untouched by this ticket.


    3) Implementation (agent, 2026-09-10): DONE - commit 973930d. Code: world.gd tier collapse 4 -> 3
    (TIER_CONE_DOT + _look_dir + _look_yaw + PICK_LOOK_REFRESH_DEG + _refresh_look_dir + the look-snap
    rescore kick + the _pool_key look components all removed; tiers are now 0 under / 1 sim radius / 2
    rest by taxi, look-independent); _low_pick f20/f21 ahead-behind logic gone (ring1 then rest by taxi
    rank); _low_dispatch_slab LOW_TASK_CAP branch now returns verdict 2 (capped no-op: the slab stays
    PENDING and is re-picked next frame) instead of the sync main-thread build; -1 means null slab only;
    low_sync_fallbacks_n is now an always-zero regression gate. Harness: the AC-0233 spin-180 probe re-scoped
    into the LOOK-INVARIANCE regression (the live tier of every entry queued in both snapshots must survive
    a 180 deg flip untouched); low_sync_zero_ok gate field added; the nightlot probe lost its world._look_dir
    assignment (the variable no longer exists) with the order-divergence comment updated to queue timing.
    VERIFY (coordinator, independent runs): genhash (0,0) 80b904c0... exact; meshprobe ok:true verts 321080
    UNCHANGED (no C++ change); r16 arm ok:true with the new spin evidence (invariant=true, common_n=658,
    t2common=642, flip_frames=0); A/B vs HEAD proved no new lod sub-field falses (air_ok/height_ok/immediate_ok
    are false in BOTH runs - pre-existing since the AC-0240 fog-wave change, not a regression); battery
    genhash+range ok:true; 0 script/shader errors across all runs. SHIPPED as AweCraft[20260910-0645 973930d]
    (:8080 byte-matched; the user also built the same tree). KNOWN: the nightlot arm (AWECRAFT_LOGIC=nightlot)
    fails at HEAD independently of this ticket (A/B: identical ok:False, baked_diffs=15, the same 15 diff
    cells) - pre-existing era breakage, tracked separately. FOLLOW-UP: the user is flying this build and
    the expected frame-drop relief did NOT fully materialize (fps still tanks to ~20 while flying) - the
    cone + sync fallback were not the whole cause; the next ticket (filed before AC-0247) instruments
    the world pipeline for per-stage ms attribution.'
