  status: done
  labels: []
  created_at: 2026-09-07T08:40
  updated_at: 2026-09-07T08:40
  completed_at: 2026-09-07 16:50:00
  waiting_on: null
  parent_id: null
  notes: '1) User Story: As a player I want the world around me - in every direction, not just in front
    of my view - to be filled out to my simulation distance before the world far ahead of my view, so
    turning around, walking sideways, or changing direction never shows me loading terrain right next
    to me. The simulation distance is the existing Options slider (default 4); it already bounds the fluid
    sim and the collision band, and should bound the build priority too.

    2) Technical Details: CURRENT (world.gd _tier_of): 4-tier lexicographic (tier, taxi) streaming priority
    - 0 under, 1 ring 1 (the 8 immediate neighbors ONLY), 2 the FOV cone (dot > TIER_CONE_DOT 0.5, reaching
    the render edge), 3 the rest by distance. THE GAP: past the 8 neighbors the forward cone outranks
    the players own surround - chunks 2+ behind/beside are tier 3 - so a turn or a sideways walk shows
    load-in right next to the player (the original AC-0231 spec said tier 1 = ring1-8; AC-0233 narrowed
    it to ring 1). Settings.sim_dist ALREADY EXISTS (default 4, clamped <= render_dist at load, the Options
    sim_slider is live-wired to Settings.apply_sim_distance, which today sets fluid_tick_radius and band0_r
    only). CHANGE: _tier_of becomes 5 tiers - 0 under; 1 = SIM RADIUS (Chebyshev distance <= sim_dist,
    matching the band0_r square semantics, absorbs the old ring-1 tier); 2 cone; 3 rest. The lexicographic
    (tier, taxi) _tier_score (10000 scale) and the debounced re-stamp machinery (RESCORE_PER_FRAME, _tier_stamp,
    the _pool_key cache) stay; add sim_dist to _pool_key so a slider change invalidates the cached picks,
    and have apply_sim_distance call the worlds rescore kick (mirror apply_render_distance). AC-0231 ORDER
    GATE AUDIT: the high-dispatch gate fires on tier >= 2 - after the renumber that is the SAME set (old
    2,3 = new 2,3; the sim tier absorbs part of the old tier 3), so the gate sites should need no change
    - verify. The in-r pre-low pass inherits the new order for free (the surround gets its lows first
    - intended). GATES: (1) R16 spin arm - after a 180 deg turn the sim circle (default 4) must fill before
    the new-facing cone catches up; (2) R16 fly50 - the ahead pre-warm must NOT regress (ahead-while counts
    within the prior run envelope - the default-4 sim circle is ~41 chunks of the R16 queue, small); (3)
    SMOKE battery ok:true; (4) genhash 25/25 A==B (tiering does not touch the gen masks - trivially green);
    (5) settings arm - sim slider default 4, persists, clamps to render_dist, a live slider change re-stamps
    the tiers (rescore event counter moves). TRADE-OFF (user 2026-09-07): a larger sim radius delays the
    forward pre-warm during flight; default 4 keeps flight behavior ~unchanged and the slider is the user
    knob that trades ahead-fill for surround-fill.'
