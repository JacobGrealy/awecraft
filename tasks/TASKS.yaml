    by distance, and far chunks unloaded, WITHOUT interrupting gameplay. Plan must cover: current pipeline audit (world.gd
    recenter/build queue, chunk.gd mesh+collision, WorldGen cost, light/fluid flushes, editperf), Godot 4 options (Task/worker
    threads vs budgeted per-frame vs hybrid; NOTE web export = single-threaded only, must degrade to budgeted), memory/ownership
    rules (one godot process; mesh build must be thread-safe or main-thread budgeted), phased rollout (phase1 budgeted streaming,
    phase2 threads if desktop-only gain), perf targets + verify approach (AWECRAFT_LOGIC=perf timing, walking-through-boundary
    timing harness), risks. Deliverable: tasks/<id>/<id>-plan.html for user review (browser). No godot code changes, no renders
    beyond what already exists.'
