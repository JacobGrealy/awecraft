      its OWN top slab + its 8 neighbors top slabs (its 3x3, c.top/16), and the kept set per column =
      that tower span UNION the player band [pys-4, pys+4] (always, any height). Changes from id 2: chunk.gd
      - vwin_mask added (the exact keep mask the last build covered; empty = full), drop_slab_high REMOVED
      (dead under keep-high); world.gd - _vwin_span(cx,cz) + _vwin_col_kept(c) (per-tower span UNION band;
      the global kept set removed), _vwin_mask_for(c) = kept UNION already-built slabs (the built range
      is sticky across atlas-swap/edit/tier transitions), _vwin_recompute band-only (a Y recenter is a
      no-op unless the band changed - X/Z walks are free), _vwin_tier0 (runs on EVERY recenter: the new
