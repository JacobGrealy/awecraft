- id: AC-0242
  title: forward-plus-srgb-display-match
  status: done
  created_at: 2026-09-07T14:05
  updated_at: 2026-09-07T16:10
  completed_at: 2026-09-07 16:10:00
  waiting_on: null
  notes: '1) User Story

    After the Forward+ migration (AC-0241) the whole world looked washed

    out versus the old gl_compatibility build. The player should see the

    same deep, punchy look on Forward+ as before the migration.

    2) Technical Details

    Root cause (measured, self-rendered A/B under lavapipe/llvmpipe with

    AWECRAFT_TIME_FREEZE + frozen seed/radius): the gl_compatibility LDR

    path displays unshaded material output WITHOUT a final sRGB encode

    (atlas grass bytes 120-134 show as ~50 under compat, ~130 under

    Forward+; compat frame == sRGB-decode of the Forward+ frame, RMSE

    ~7/ch). Forward+ encodes correctly, so every unshaded 3D surface

    rendered one sRGB curve brighter than the old build - the washout.

    Fix: AeroLib.srgb_pre() returns 1.0 under forward_plus, 0.0 under

    gl_compatibility; each unshaded shader pre-decodes its final color

    (ALBEDO = mix(ALBEDO, pow(ALBEDO, vec3(2.2)), u_srgb_pre)) so the

    pipeline encode round-trips to the old display. Patched: chunk_lit

    _opaque/_cutout/_fluid/_flower, fluid_anim, aero_sky, aero_wash

    (the additive wash in the linear HDR buffer was lifting darks an

    extra 40-80 levels in the blue channel - it needs the same decode).

    The u_srgb_pre uniform rides the existing per-frame chunk push in

    _update_sky plus one-time sets (fluid_anim_mats, aero sky/wash).

    Harness: AWECRAFT_TIME_FREEZE env added (snapshot runs 3000+ frames

    and the day clock drifted a quarter cycle frame-dependently between

    software renderers, confounding every A/B before the freeze).

    Verify: frozen A/B pairs (seed 44, radius 2, time 0.25, 960x540,

    grade off AND on): bare mean |ref-fwd| 4.25/channel (pre-fix ~60),

    graded 2.56; all regions within 3-9. SMOKE battery green

    (player/interact/light/fluids, light arm torch 14/far 0-9/surface

    15/cave 0 = baseline). PENDING: user visual confirm on Windows GPU

    (exe rebuilt).

    '
