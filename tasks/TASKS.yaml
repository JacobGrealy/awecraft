- id: AC-0258
  title: lods-treat-clutter-as-air
  priority: 3
  status: open
  notes: '1) User Story: As a player far away I want tiny clutter like flowers and grass to disappear
    in low/medium LODs so distant terrain stays cheap and clean, only showing full detail up close.


    2) Technical Details: godot/world/world.gd + chunk.gd + gdext/src/mesh.cpp. On low at 4x4x4 and medium
    (and optionally high far) treat clutter blocks (flowers, tall grass, etc.) as air when building the
    bitset/mesh — skip them in the greedy walk. Keep them in c.data per slab at its Y, only cull visually
    in LODs. Verify far terrain has no flower speckling, close high still shows them; no extra alloc.'
