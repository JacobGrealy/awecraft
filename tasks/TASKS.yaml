  parent_id: null
  notes: '1) User Story: As a player breaking a block next to or under water I want the water to move
    - fall through the hole, spread sideways - so flow is visible and reliable. (User report 2026-09-09:
    water no longer flows.)


    2) Technical Details: Root cause in world.gd tick_fluids sparse scan (AC-0203 era): the per-slab cell
    index is (ly<<8)|(lz<<4)|lx (full 12-bit value); the scan passed (cell & 255) to _data_at_slab, which
    read the ly=0 row of every slab. Above-slab water saw deep stone, failed is_fluid_id, and its fl level
    was zeroed every tick - the water could never move (bucket/placed water sat statically; natural ocean
    was unaffected because it is fl=0). Fix: pass the full cell value for the data read and below_pos
    = cell - 256. New harness arm AWECRAFT_LOGIC=fluidflow (battery mode fluidflow): terrain-independent
    stone-box fall case + stone-pit spread case; verified ok:true (fall_moved, spread_n1=4, wall kept).


    3) Implementation (agent, 2026-09-09): DONE - commit 276229b. Root cause: the AC-0203 sparse fluid
    scan passed (cell & 255) as the per-slab pos to _data_at_slab; the per-slab index is (ly<<8)|(lz<<4)|lx
    (12-bit), so every above-slab water cell read the ly=0 row of its slab (deep stone), failed is_fluid_id,
    and its fl level was zeroed every tick - placed/bucket water could never move. Fix in world.gd tick_fluids:
    the data read uses the full cell value and below_pos = cell - 256 (the neighbor reads already used
    cell & 3840 and were correct). New harness arm AWECRAFT_LOGIC=fluidflow (battery mode fluidflow):
    terrain-independent stone-box fall case (source in a stone-lined box on one support - the only legal
    move is down through the broken support; asserts fall + source cleared + walls intact) and a stone-pit
    spread case (source on a 5x5 platform - asserts the 4 ring-1 neighbors fill and the walls stay). Second
    layer (user report 2026-09-09: "it was broken in lake" - natural water): worldgen water is stationary
    by AC-0203 design (block 5 with fl=0, never in the fluid_wet set the scan is gated on, and the set_block
    wake only reset the global counter), so breaking next to a lake did nothing. Fix: world.gd _wake_fluid_around(x,y,z)
    - on a set_block near a fluid, the 6 neighbors that are fluid-id with fl==0 get set_fl_at(7) + their
    chunk marked in fluid_wet (the rest of the lake stays fl=0, zero scan work). New fluidflow CASE 3
    (natural pool written via set_local with NO fl): stays put until the support block is broken (falls
    in) or a side block is broken (spreads into the trench). Verify: ok:true (nat_natural, nat_stayed,
    nat_fall, nat_spread); syntax 0; SMOKE battery ok (15 modes incl. fluidflow + range, 0 SCRIPT ERROR);
    genhash baseline held.'
- id: AC-0245
  title: water-boundary-faces
  source: user
  projects:
  - awecraft
  assignee: opencode
  priority: 2
  status: open
