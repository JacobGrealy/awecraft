      main-thread), enabled only if Phase 1 boundary frames are still gen-dominated. Web stays single-threaded (thread_support=false,
      export_presets.cfg:25; threaded web needs COOP/COEP on serve_web.py). Stale numbers flagged: ''recenter sync gen ~0.8s''
