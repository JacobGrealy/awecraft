    In the Godot build, flower/plant/cross-type blocks (poppy, tall grass, and any other non-rectangular/planar block) render
    as FULL CUBES; per the frozen web spec (../index.html) + Minecraft they should render as SPRITES (cross/billboard), not
    cubes. KNOWN STATE: AC-0066 already established chunk cross-quad (XQ) geometry (ALPHA_SCISSOR+CULL_DISABLED) + a held
    cross mesh, and AC-0073 notes a flower is "real icon pixels on a cross-quad" in SOME context - so INVESTIGATE which code
    path is emitting a full cube for these blocks in the WORLD mesh (world/chunk.gd build_mesh + how Data block type/rect
    is consulted) vs where cross quads are used. Fix: (a) mark the cross/plant block ids as cross-type in the block data (derive
    the id list from the frozen web spec''s block table, not by guess); (b) emit cross-quad billboard geometry (two crossed
    quads carrying the block texture) in the chunk mesh instead of a full cube for those ids; (c) keep alpha/scissor/cull
    correct. Per user "rotating sprites": FIRST check how the frozen web spec renders these (static crossed quads vs camera-facing
