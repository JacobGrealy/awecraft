    vs budgeted per-frame vs hybrid; NOTE web export = single-threaded only, must degrade to budgeted),
    memory/ownership rules (one godot process; mesh build must be thread-safe or main-thread budgeted),
    phased rollout (phase1 budgeted streaming, phase2 threads if desktop-only gain), perf targets + verify
    approach (AWECRAFT_LOGIC=perf timing, walking-through-boundary timing harness), risks. Deliverable:
    tasks/<id>/<id>-plan.html for user review (browser). No godot code changes, no renders beyond what
