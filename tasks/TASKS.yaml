    node transform places it on sphere (no per-vertex warp, 16×H×16 uniform 1m stays). Greedy stops at face edges (no cross-face
    merge). world/generator.gd: per-face heightmap h=R+fbm(u,v) with 4-texel edge blend (same height on both sides), Y-corner
    gap filled with hidden filler tetra (never exposed/minable). Horizon culling realistic: cull if dot(chunk-C, eye-C) <
    R², horizon dist √(2·R·h) ≈114m at 1.62m on R=4000. Gates: 5×5 slab on each Y no hole, walk 12 edges + 8 corners on_floor
    true, horizon 114m, 30-block tower visible ~604m.


