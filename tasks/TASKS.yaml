  waiting_on: AC-0237
  parent_id: null
  notes: '1) User Story: As a player I want the light pass to cost only where light can be seen, so the
    periodic light refresh and torch/fluid edits stop paying for the black deep interior the AC-0234 window
    already decided to render as capped (the user asked on 2026-09-06: can we skip generating lighting
    in the black slabs and below). A culled slab has zero light consumers — the cap is an unshaded black
    material_override (no vertex colors read) and there is no mesh/low/fog there — so its light is computed
    for nobody today.


    2) Technical Details: RESEARCH (done 2026-09-06, agent): the contained light kernel (awelight::pull
    in gdext/src/lighting.cpp) already takes a top arg (hact = top+1 — the sky above the column top is
    already free); the masked version adds the SAME 24-byte keep mask the mesh path got in AC-0234 (empty
    = current behavior, bit-identical). The flood runs on kept slabs only; culled cells are treated OPAQUE
    to propagation and their eff/mask bytes stay 0. Call sites: (1) the contained kernel inside build_accs
    (gdext/src/mesh.cpp ~1818 — it already HAS the mask arg, just pass it through); (2) the AweLighting
    class methods the main-thread flush uses (lighting.cpp ~478: light_pending torch/fluid edits + the
    ~500ms refresh — the ~21ms p95 residual from AC-0213). EFF CACHE VALIDITY (the real plumbing): a cached
    eff computed under an older window has 0s in the culled slabs — when the window re-enters (band slides
    / span grows) the eff must be re-computed: stamp the eff cache entries (and the chunk saved_light
    restore path, world.gd ~4473) with the window version so a window change = cache miss for the affected
    columns (self-light is the existing 2.2% miss path — re-entered chunks are a small set). The re-queue
    dispatches from AC-0234 (superset / tier-0 / kept-cap re-queue) already force fresh builds — route
    them through the self-light path. CORRECTNESS EDGES (all contained by construction — light is computed
    only where it can be seen): a torch INSIDE a culled slab no longer leaks into at most 2 boundary cells
    of an adjacent kept slab (attenuation is 15 blocks; the region renders black anyway) — re-entry rebuilds
    re-light and restore it; sky through a deep culled shaft stops at the band bottom (the shaft is a
    black cap — invisible). NO codec change: the eff/saved_light arrays keep full size (zeros in the culled
    part). HONEST SAVINGS: the main-thread flush is the real win (~70% fewer flood cells at ground: slabs
    7-9 of 0-9 — the p95 refresh residual shrinks proportionally); worker builds see the kernel only on
    the 2.2% eff-cache miss + re-entry chunks (total build time barely moves); gen and the fill rate are
    NOT touched (that is AC-0237). FILES: gdext/src/lighting.cpp (pull + mask, AweLighting class methods),
    gdext/src/mesh.cpp (pass the existing mask to the contained call), godot/world/world.gd (eff cache
    stamp + saved_light invalidation + flush path passes the mask), .so rebuild + stage. GATES: lightprobe
    A/B — masked run vs full run: KEPT-slab eff byte-identical (the only legal difference = boundary cells
    adjacent to a torch inside a culled slab — encode that tolerance in the probe; on the torch-free R16
    terrain expect 100% match); meshprobe 1926 (lossless — the mesh side is unchanged); SMOKE battery
    (the light battery torch 15/0/14 baseline; a torch placed while a neighbor slab is culled, then the
    player re-enters: the light is restored); R16 (light gate, the vwin phase, fps — the flush residual
    expected smaller); syntax gate. Standing: godot one at a time; HOME=/tmp/dsh_home; .so rebuild recipe
    in godot/CONTINUITY.md (stage to godot/bin/ after any C++ change).'
