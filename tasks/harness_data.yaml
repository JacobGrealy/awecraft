  seamcensus:
    entry: '`_seamcensus_test` (AC-0353)'
    tests: |-
      THE CROSS-CHUNK SEAM FACE CENSUS (measurement only — the instrument for the user-visible seam holes; AC-0354/AC-0355 gate on its fields). Nothing else reads geometry ACROSS a seam: `occlude` counts leaking faces within a chunk, `farab` proves the far HEIGHT field, `ladder`/`meshprobe`/`lightstate`/`halo` compare emitted geometry to a reference built the SAME WAY. This arm reads the LIVE LANDED MESHES (the visible tier per slab: high `mesh_instance`, else the off-tree low slot) and reverse-maps every seam-plane quad — quad k owns verts [4k..4k+3], the flat axis is the face plane, the covered cells are the integer ranges along the other two axes, the direction is the stored normal cross-checked against the winding (HIGH verts chunk-local x,z 0..16 with Y ABSOLUTE; LOW avg verts slab-local, yoff si*16). THE ASSERTION per seam (both columns built): the faces EMITTED on the shared plane must equal the complement of the neighbour's CURRENT solid set at that row (solid next to solid emits nothing; exactly-one-solid emits exactly one face from its side). MISMATCH DIRECTIONS SEPARATE: `missing_faces` (both culled → see-through, the user's hole), `spurious_faces` (both emitted → double draw, the far-band class), plus `shifted_faces` (face on the wrong side — same plane, invisible) and `spurious_single` (face where both sides agree). Per seam: both column keys, the plane (dx/dz), the row range, the direction counts, and each side's REPRESENTATION CLASS (F full skip-0 / A band-A materialized skip-1 / BC far h-only skip-2, from `far`/`far_mat`) via the `by_class` pair breakdown. The per-side solid set: F/A = the mesher's stab over `flat_data()`; BC = y ≤ H (the `far_h` u16) OR a tree cell (the emitter's veg cells); aquifer water NOT solid. The REVERSE MAP IS VALIDATED IN-ARM FIRST (a wrong map would invent holes): a 6-cell fixture (two 1×3×2 stone pillars across a real-band seam, the air column at the seam plane keeping both seam faces exposed) is written, its remesh waited, the same reverse map must recover EXACTLY the analytic faces (44 total, 12 on the seam plane) with the winding consistent, then the fixture is REVERTED and the clear re-checked before the census runs
