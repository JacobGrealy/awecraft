schema: 1
note: Single machine-readable source for the generated tables in godot/HARNESS.md. Render with tasks/scripts/harness_doc.py --render; verify with --check. Never hand-edit inside a BEGIN/END GENERATED marker in the doc.
mode_columns:
- mode
- harness entry
- what it tests (1 line)
- key RESULT fields
- envs
- typical wall (2026-08-24)
- notes
modes:
  player:
    entry: |-
      `_player_logic_test` (`_player_logic_test_body` in battery)
    tests: |-
      WASD move, floor, jump peak, fly toggle, time ticks
    result_fields: |-
      `start`, `after_fwd`, `horizontal_moved`, `is_on_floor`, `jump_peak_y`, `after_fly_y`, `time_before`, `time_after`
    envs: —
    wall: 3 s (standalone) / 2.7 s battery
    notes: battery smoke mode
  look:
    entry: '`_look_test`'
    tests: |-
      mouse-drag look deltas, pointer-lock behavior, no drag-mine
    result_fields: |-
      `yaw_after_drag`, `drag_yaw_delta`, `drag_pitch_delta`, `locked_yaw_delta`, `dragging`, `drag_mined`, `drag_yaw_ok`, `drag_pitch_ok`, `locked_yaw_ok`, `locked_pitch_ok`, `ok`
    envs: —
    wall: ~4 s (1 s, 2026-08-24, ok:true)
    notes: pointer-lock input via synthetic events
  interact:
    entry: |-
      `_interact_test` (`_interact_test_body` in battery)
    tests: |-
      DDA select, long-press mine → drop + pickup, place block
    result_fields: |-
      `target_cell`, `breakable_id`, `highlight_visible`, `after_mine_cell`, `drop_spawned`, `inv_grew`, `place_cell`, `after_place_cell`, `place_ok`
    envs: —
    wall: 3 s (standalone) / 1.3 s battery
    notes: 'known-stable: `drop_spawned`/`place_ok` true'
  craft:
    entry: '`_craft_test`'
    tests: |-
      shapeless 2×log→4 planks, table shaped pickaxe, inv bookkeeping
    result_fields: |-
      `ok`, `data` (r: `logs_start`, `out_a`, `planks_a`, …), `inv` (Debug.inv_dump), `armor` (Debug.armor_dump)
    envs: —
    wall: |-
      ~15–30 s (not re-run 08-24; long scripted UI sequence)
    notes: slow-ish UI mode
  guiclick:
    entry: '`_guiclick_test`'
    tests: |-
      inventory click/drag routing, held grab/drop, real recipe click (E planks, table pickaxe)
    result_fields: |-
      `ok`, `data` (r: `held0`, `held_down`, `hot0_up`, `two_click`, `drop_hot0`, `drop_storage`, + real-recipe keys)
    envs: —
    wall: ~15–30 s (not re-run 08-24)
    notes: AC-0059 gate
  combat:
    entry: '`_combat_test`'
    tests: |-
      bare-hand punch 1 dmg, attack cooldown, sword 4 dmg, mob death drops, no-target safe
    result_fields: |-
      `bare`, `bare_hp`, `post_double_hp`, `cooldown_ok`, `weapon_dmg`, `death_drops`, `death_ok`, `no_target`, `ok`
    envs: —
    wall: ~10–20 s (not re-run 08-24)
    notes: spawns mobs
  swing:
    entry: '`_swing_test`'
    tests: |-
      swing-by-rotation (AC-0085): single-axis pitch arc, punch, 0.9 s loop cycles, tool voxel render, tier tint, walk sway/bob
    result_fields: |-
      `ok`, `data` (r: `saw_mid_swing`, `mid_frac`, `swing_max_rot` (>0.4, ≈0.85), `settled`, `punch_max_rot`, `loop_cycles_0.9s` (3–5), `tool_111..123`, `tier_differs_111_vs_113`, `fist_after_empty`, `walk_bobs` (4–10), `walk_y_crossings`, `walk_idle_max_off`)
    envs: —
    wall: ~15 s (not re-run 08-24)
    notes: post-AC-0085 asserts rotation not position
  survival:
    entry: '`_survival_test`'
    tests: |-
      tool vs bare mine speed, gated drops, armor DR, hunger drain/regen/starve, eat, respawn
    result_fields: |-
      `tool_ratio`, `bare_ms`, `pick_ms`, `drop_bare`, `drop_pick`, `dmg_none`, `dmg_armor`, `hunger_drain`, `hunger_mine`, `hunger_regen`, `starve`, `eat`, `respawn`, `dump`, `ok`
    envs: —
    wall: ~60–120 s (not re-run 08-24)
    notes: long survival sequence; builds flat pad
  hunger:
    entry: '`_hunger_toggle_test`'
    tests: |-
      hunger_enabled off pins 20 + regen intact; on → starve damage
    result_fields: |-
      `pin_to_full`, `off` {`hunger`,`min_hp`,`regen_gain`,`regen_ms`,`attack_cost_zero`}, `on` {`starve_dmg`,`starve_ms`}, `ok`
    envs: —
    wall: ~20–40 s (not re-run 08-24)
    notes: AC-0063 gate
  light:
    entry: '`_light_test`'
    tests: |-
      sky light bake: surface 15, cave 0, torch level 14, BFS reach
    result_fields: |-
      `surface_eff` (15), `cave_eff` (0), `torch_level` (14), `torch_far_before` (0), `torch_far_after` (9)
    envs: —
    wall: 4 s (standalone) / 2.9 s battery
    notes: known-stable
  daynight:
    entry: '`_daynight_test`'
    tests: |-
      sun energy/sky color at t=0.25 vs 0.75, full cycle period
    result_fields: |-
      `time_025`, `time_075` (DayNight readouts), `cycle_elapsed_ms`, `cycle_expected`, `cycle_actual`, `cycle_delta_ok`, `colcheck`, `ok`
    envs: '`AWECRAFT_TIME`'
    wall: ~30–60 s (not re-run 08-24)
    notes: runs a full day cycle
  tint:
    entry: '`_tint_test`'
    tests: |-
      per-block vertex tint (tinted vs untinted surface samples)
    result_fields: '`ok`, `samples` (out)'
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: ''
  settings:
    entry: '`_settings_test`'
    tests: |-
      settings defaults 50/1, ranges 4–96, sim→render clamp, load clamp, apply, volume, hunger toggle (AC-0072)
    result_fields: |-
      `defaults`, `range`, `sim_clamp`, `load_clamp`, `apply`, `volume_ok`, `hunger` {saved_off, reloaded_off, back_on, default_true}, `ok`
    envs: '`AWECRAFT_IGNORE_SETTINGS` (self-managed)'
    wall: ~5 s (not re-run 08-24; fast class)
    notes: |-
      dispatched at main.gd:576 BEFORE game nodes (works standalone + in battery)
  fluids:
    entry: '`_fluids_test`'
    tests: |-
      source stability, level-7 sideways spread, water+lava reactions, sea zero-write invariant
    result_fields: |-
      `shore_after` ([5,7]), `source_after` ([5,8]), `water_delta` (1), `water_on_lava_result` (25), `sideways_lava_result` (9), `sea_stable` (true), `sea_surface_before`/`_final` (2756), `sea_backed_before`/`_final` (914); prints `FLUIDSTAT` line
    envs: —
    wall: 5 s (standalone) / 3.8 s battery
    notes: |-
      known-stable; AC-0068 invariant; sea counters are the count over `world.chunks.keys()` — AC-0152/0160 changed the r4 resident set (121→69 chunks) → new baseline 2756/914 (old 2730/888 VOID)
  fluidprobe:
    entry: '`_fluidprobe_test`'
    tests: probes water column positions (debug scout)
    result_fields: '`done` (true)'
    envs: —
    wall: ~5 s (not re-run 08-24)
    notes: ''
  fluidfall:
    entry: '`_fluidfall_test`'
    tests: |-
      AC-0068: source over hole stationary (0 writes), descending column lands + 7-wide spread, flat pool shore
    result_fields: |-
      `sy`, `caseA_source`, `caseB_full`, `caseC_flat`, `shore`, `far`, `beyond`, `center`, `caseA_ok`, `caseB_ok`, `caseC_ok`, `ok`
    envs: '`AWECRAFT_SETTLE_TICKS` (forces hard settle)'
    wall: ~10 s (not re-run 08-24)
    notes: r=2 forced
  webfall:
    entry: '`_webfall_test`'
    tests: |-
      web-fall parity: settled + landed + floor spread ≥100 cells
    result_fields: |-
      `settled`, `landed`, `floor_cells`, `total_water`, `sy`, `ok`
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: r=2 forced
  fluidsettle:
    entry: '`_fluidsettle_test`'
    tests: |-
      world-wide fluid settle: ticks to quiescence, final water count
    result_fields: |-
      `ticks_to_settle`, `quiet`, `water_final`, `chunk_count`
    envs: '`AWECRAFT_SETTLE_TICKS`'
    wall: ~10–20 s (not re-run 08-24)
    notes: ''
  buckets:
    entry: |-
      `_buckets_test` (`_buckets_test_body` in battery)
    tests: bucket scoop water → item 140, place back
    result_fields: |-
      `scoop_before`, `after_scoop`, `inv_scoop`, `place_after`, `inv_place`
    envs: —
    wall: |-
      ~5 s (standalone, not re-run 08-24) / ~3 s battery
    notes: battery full mode (not in 08-24 smoke)
  water:
    entry: '`_water_test`'
    tests: |-
      player water-column physics: rise to shore top, land on shore, water cell intact
    result_fields: |-
      `B`, `shore_top`, `timeline`, `max_y`, `first_above_frame`, `above_top`, `landed_frame`, `standing_on_shore`, `final`, `final_on_floor`, `water_cell_intact`, `ok`
    envs: —
    wall: ~20 s (not re-run 08-24)
    notes: ''
  fpv:
    entry: '`_fpv_test`'
    tests: |-
      first-person view atlas UVs in range, grass top/side distinct
    result_fields: |-
      `has_uv`, `uv_min`, `uv_max`, `uv_in_range`, `grass_top`, `grass_side`, `grass_distinct`
    envs: —
    wall: ~5 s (not re-run 08-24)
    notes: ''
  held:
    entry: '`_held_test`'
    tests: |-
      held block box vs cross sprite visibility (AC-0066 fidelity)
    result_fields: |-
      `ok`, `block_held_ok`, `block_visible`, `block_type_ok`, `sprite_hidden_during_block`, `region_actual`, `region_want`, `tool_held_ok`, `tool_visible`, `tool_type_ok`, `empty_hidden_ok`
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: ''
  toolres:
    entry: '`_toolres_test`'
    tests: |-
      tool voxel model resolution: 5 tools present + type + tier color + box/fist fallback
    result_fields: |-
      `ok`, `tool_111`/`115`/`119`/`123`/`113` {`present`,`type`,`fist`,`sprite`,`box`,`ok`}, `headcolor_111`/`headcolor_113`, `tier_differs_111_vs_113`, `box_after_tool`, `fist_after_empty`
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: AC-0070 gate
  toolpose:
    entry: '`_toolpose_test`'
    tests: |-
      tool orientation + scale ×2 + depth-disable (AC-0073/0067/0085)
    result_fields: |-
      `ok`, `held_box_scale_x` (≈0.70), `held_sprite_scale_x`, `scale_ok`, `tool_…` {`position_ok`,`arc_ok`,`vertical_ok`,`handle_below_cam`,`bbox_diag`,`diag_2x_ok`,`depth_disabled`,`ok`}, `depth` {tool,box,fist,sprite}, `depth_ok`
    envs: —
    wall: ~15 s (not re-run 08-24)
    notes: handle y < −0.55
  viewmodel:
    entry: '`_viewmodel_shot`'
    tests: |-
      AC-0085 render hook: idle/apex head+handle centroids for a held tool
    result_fields: |-
      `vmshot`, `frac`, `idle_head`, `idle_handle`, `apex_head`, `apex_handle`
    envs: |-
      `AWECRAFT_VMITEM`, `AWECRAFT_VMSHOT`, `AWECRAFT_VMFRACTION`
    wall: ~10 s headless (render hook; xvfb for the shot)
    notes: centroid-only in headless
  wallshot:
    entry: '`_wallshot_test`'
    tests: |-
      AC-0067 on-top: held box/sprite vs stone wall pixel regions (before/after)
    result_fields: |-
      `before`, `shots`, `wall_face_z`, `block` {`block_frame_stone`,`block_vm_nonstone`,`block_box_vis`,`block_depth_on`}, `item` {`item_vm_cyan`,`item_sprite_vis`}
    envs: |-
      `AWECRAFT_WALL_BEFORE` (1), `AWECRAFT_WALL_SHOTS`, `AWECRAFT_SNAPSHOT` (paths)
    wall: render mode (~300 s timeout)
    notes: xvfb; writes shots into `tasks/AC-0067/`
  editperf:
    entry: '`_editperf_test`'
    tests: |-
      single block edit: flush frames, build cost, no hitch
    result_fields: |-
      `cell`, `edited_id`, `cell_after`, `flush_done`, `flush_frames`, `max_frame_build_ms`, `single_build_ms`, `total_ms`
    envs: —
    wall: ~5–10 s (not re-run 08-24)
    notes: ''
  perf:
    entry: '`_perf_test`'
    tests: |-
      full-radius build/drain/first-draw/frame percentiles + memory
    result_fields: |-
      `chunks`, `render_radius`, `fog_near`/`fog_far`/`fog_edge`/`fog_ok`, `total_chunks`, `all_meshed`, `collision_shapes`, `total_ms`, `frames`, `recenter_ms`, `max_frame_ms`, `build_units`, `drain_frames`, `max_drain_ms`, `gen_ms`, `build_ms`, `first_draw_ms`, `p50_ms`, `p95_ms`, `frame_max_ms`, `mem_before_bytes`, `mem_after_bytes`, `drain_s`
    envs: |-
      `AWECRAFT_RADIUS`, `AWECRAFT_THREADGEN_N`/`TGDEBUG`, `AWECRAFT_RECPROBE`, `AWECRAFT_DRAIN_MS`, `AWECRAFT_GEN_BUDGET`, `AWECRAFT_MESH_INFO`
    wall: |-
      r4 ≈12.3 s total_ms (measured `.scratch/ac0082_g4_perf_r4_t1.log` 2026-08-24); **r50 ≈850 s total_ms (from 2026-08-24 03:25 log `ac0082_g4_perf_r50_t1.log`)**
    notes: SLOW at r50 — use 3000 s timeout
  boundary:
    entry: '`_boundary_test` (via `_await_boundary_core`)'
    tests: |-
      chunk streaming: walk r chunks, crossings, bursts, forward/trailing wall, mem, marker round-trip
    result_fields: |-
      `ok`, `radius`, `walk_chunks`, `walk_speed`, `walk_s`, `crossings`, `p50_ms`, `p95_ms`, `max_ms`, `loads`, `unloads`, `flap`, `burst_ms_per_crossing`, `burst_p50_ms`, `burst_p95_ms`, `burst_max_ms`, `forward_wall_ms_per_crossing`, `forward_p95_ms`, `forward_max_ms`, `trailing_*`, `fluid_tick_ms_p95`, `mem_delta_mb`, `marker`, `marker_ok`, `remesh_ok`, `resident_final`, `built_final`, `in_radius_built_final`/`_max`/`_min`, `in_radius_present_final`, `target_in_radius`
    envs: |-
      `AWECRAFT_RADIUS` (r), `AWECRAFT_WALK`, `AWECRAFT_WALK_SPEED`, `AWECRAFT_TICKTIME`, `AWECRAFT_THREADGEN_N`/`TGDEBUG`, `AWECRAFT_RECPROBE`
    wall: |-
      r3 45 s, r4 46 s (measured 2026-08-24); r50 ≈1400 s wall (from 2026-08-24 10:34 log `.scratch/ac0079r3_battery/b_r50.log`)
    notes: SLOW at r≥8 — 3000 s timeout; fluid sim enabled
  atlas:
    entry: '`_atlas_test`'
    tests: spawn chunk mesh UV sanity
    result_fields: '`ok` (or `error`)'
    envs: —
    wall: ~5 s (not re-run 08-24)
    notes: ''
  r16:
    entry: '`_r16_test` (AC-0212)'
    tests: |-
      16-radius build + moving inside a chunk: per-frame CPU in static vs moving phases (frame ms → effective fps), camera on a 12 m circle inside the spawn chunk (frustum changes every frame)
    result_fields: |-
      `ok`, `radius` (16), `ho_cap` (AC-0225: the "chunks_per_frame" handoff cap in force), `built`/`built_all`/`total_chunks` (1089), `resident`, `build_ms`, `cull_mode` (`engine` default / `manual`), `perf_cull_passes`/`perf_cull_flips` (manual-pass counters for the WHOLE arm — 0/0 in engine mode), `static`/`moving` {`n`,`p50_ms`,`p95_ms`,`max_ms`,`fps_p50`,`fps_p95`,`fps_min`}, `drop_fps_static_vs_moving`
    envs: |-
      `AWECRAFT_FRUSTUM` (engine [default] / manual / 0), `AWECRAFT_RADIUS` (forced ≥16 by the arm)
    wall: |-
      LONG — run `--fixed-fps 600` so ticks are uncapped and the frame-ms awaits measure true per-frame CPU (same convention as breakspike); ~3–8 min wall (r16 build, 25-min in-arm cap, proceeds on partial build)
    notes: |-
      AC-0212 #1 gate: A/B `AWECRAFT_FRUSTUM=manual` vs default engine — no 5 fps drop in the moving phase (the removed manual pass re-evaluated every resident chunk on every camera change)
  spin:
    entry: '`_spin_test` (AC-0109 G1; row added at AC-0212)'
    tests: |-
      360° spin: no on-screen flicker (`transitions` 0), verts drop looking sideways, all-chunks-restore, queue flat.
    result_fields: |-
      **AC-0212: cull-lane aware** — `cull_mode`=`engine` (default) replicates the render server's exact per-instance AABB-vs-frustum test (no margin) instead of reading `.visible`; `manual` keeps the legacy `.visible` read. New RESULT: `cull_mode`, `manual_pass`, `perf_cull_passes`, `perf_cull_flips`, `instances_total`, `instances_hidden`
    envs: '`AWECRAFT_FRUSTUM`'
    wall: ~30–60 s (r4 build + 121 steps)
    notes: |-
      `ok` = transitions==0 + verts_drop + vis_end==vis_start + queue_flat
  genhash:
    entry: '`_genhash_print`'
    tests: |-
      5×5 (25) chunk data-gen MD5 parity — world/* change gate
    result_fields: |-
      prints `GENHASH cx cz <32-hex>` ×25 + `GENMS` (no RESULT dict)
    envs: '`AWECRAFT_SEED` (default 44)'
    wall: 2 s
    notes: |-
      known-stable: 25/25 identical across verified tasks; seed 99 → all 25 differ
  trees:
    entry: '`_trees_test`'
    tests: tree generation + cross-quad mesh per chunk
    result_fields: '`ok`, `data` (out), `per_chunk`'
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: ''
  save:
    entry: '`_save_test`'
    tests: |-
      3-slot save/continue: edits persist, player/inv/slot isolation, clear
    result_fields: |-
      `ok`, `saved_ok`, `clear_ok`, `clear_pre_ok`, `blocks_match`, `blocks_total`, `unedited_match`, `player_match`, `pos_ok`, `sel_ok`, `hp_ok`, `hunger_ok`, `time_ok`, `inv_match`, `slot0_ok`, `iso_ok`, `iso_base`
    envs: —
    wall: ~10–20 s (not re-run 08-24)
    notes: uses `user://` saves
  dropshot:
    entry: '`_dropshot_test`'
    tests: textured block-drop render (AC-0083)
    result_fields: |-
      `dropshot` (true), `spawned`, `drop_count`, `cam`
    envs: '`AWECRAFT_SNAPSHOT` (output path)'
    wall: render mode (~300 s)
    notes: xvfb
  crossshot:
    entry: '`_crossshot_test`'
    tests: flower cross-sprite render (AC-0084)
    result_fields: '`crossshot` (true), `placed`, `tx`, `ty`, `tz`'
    envs: '`AWECRAFT_SNAPSHOT`'
    wall: render mode (~300 s)
    notes: xvfb
  quitmenu:
    entry: '`_quitmenu_test`'
    tests: |-
      pause→quit-to-menu: save written, world freed, back to active menu (AC-0081)
    result_fields: |-
      `ok`, `paused_ok`, `menu_scene_active`, `world_cleared`, `save_written`, `seed_ok`, `edits_ok`, `slot`, `script_errors_seen`
    envs: —
    wall: ~10–20 s (not re-run 08-24)
    notes: clears all 3 slots first
  mainmenuexit:
    entry: '`_mainmenuexit_test`'
    tests: |-
      main-menu Exit button: menu-first boot, finds Exit button, press → app quit (AC-0099)
    result_fields: |-
      `menu`, `menu_state`, `menu_visible`, `exit_found`, `ready_to_quit`
    envs: —
    wall: ~5–10 s
    notes: |-
      self-quit harness (Exit press → `get_tree().quit()` on desktop); intercepted in `_ready()` BEFORE the game dispatch; BATTSKIP in battery (self-quits the process)
  occlude:
    entry: '`_occlude_test`'
    tests: |-
      interior-skip audit + occluder node graph (AC-0110): leaking 6-solid-neighbor faces, per-slab full-solid occluders, enclosed-cave flood, underground verts
    result_fields: |-
      `ok`, `chunks_built`, `total_verts`, `underground_verts`, `underground_faces`, `full_solid_slabs`, `occluders`, `box_sample`, `leaking_cells`, `leaking_faces`, `interior_voxels`, `no_emitter`, `cave` (`cells`,`aabb_min`,`aabb_max`,`seed`,`open`), `cull_3d`, `use_occl`, `radius`
    envs: —
    wall: ~60–90 s (r4 build)
    notes: |-
      headless: `occluders` 0 (gated off, DisplayServer check); under xvfb: `occluders` == `full_solid_slabs` (25 @ r4 seed 44, box 15³)
  bandmap:
    entry: '`_bandmap_test`'
    tests: |-
      AC-0152/0160 banded streaming evidence @ R=50 (no full drain): tick diamond / render circle / band counts / spawn-3×3 time / trickle queue trend / band-2 full-mesh sample
    result_fields: |-
      `render_radius` (50), `band0_r`/`band1_r`, `stream_set_home` (8253), `circle50_chunks` (7845), `tick_set_band0` (41), `band_counts` {b0 41, b1 104, b2 7700, b3 408=ring}, `spawn3x3_ms` (~3.2–4.0 s machine floor), `trickle` [{f, q, built}…1500 frames], `queue_final`, `built` {b0,b1,b2}, `b0_unbuilt`, `b1_unbuilt`, `band2_sample` [{key, band, mesh_built, quad_count}], `elapsed_ms`; `B0LOST` watchdog lines
    envs: |-
      `AWECRAFT_BAND0`/`AWECRAFT_BAND1` (world.gd band overrides)
    wall: ~60–120 s (no full r50 drain)
    notes: |-
      counts are from the stubbed streaming set; `b1_unbuilt` non-empty is expected (trickle hasn't reached it); band-2 `quad_count` ≫ 1 = full mesh (impostor era value was exactly 1); full r50 drain is intrinsically ~15–25 min wall (H=384 build CPU) — the gate is the TREND (monotone queue, no strand), not completion in-arm
  chunkio:
    entry: '`_chunkio_test`'
    tests: |-
      AC-0155 full-column save round-trip in one process: fresh r=4 41-set → evict (files written) → r4 revisit (41 read from disk, byte-identical, GENMS 0) → r50 revisit (disk-served)
    result_fields: |-
      `ok`, `wall_ms` (≤60000), `diamond` (41), `files_exist` (41), `byte_identical` (41), `origin_disk` (41), `origin_gen` (0), `gen_delta_c` (global gen counter, not the 41-set), `disk_delta_c`, `phaseA` {gen 53–54, disk 0}, `r50` {disk 41, gen 0}, `disk_reads_total`, `disk_read_ms` (~21 ms/read), `gen_count_total`
    envs: '`AWECRAFT_SEED`'
    wall: ~33 s
    notes: |-
      uses slot 0's `user://chunkdir_0` (cleared at arm start); files only exist after the in-arm evict — first visit always gens; world counters `disk_reads`/`gen_count`/`chunk_origin` (world.gd) are the provenance evidence; AC-0164: I/O is threaded (encode/decode/FileAccess on the threadgen pool) — main-thread cost per save/read ≈ 0.05 ms, RESULT gains an `io` counter block (enq/dedup/fails/main ms)
  nofallback:
    entry: '`_nofallback_test` (AC-0208)'
    tests: |-
      no-GDScript-fallback gate: boots a real world and proves EVERY C++ lane ran (counters advanced) while every GDScript reference kernel stayed dead (sentinels 0); torch glow source proves the C++ light lane end-to-end (C++-landed `last_eff` at the torch > 5); direct encode→decode_column C++ slab-IO roundtrip on a real column
    result_fields: |-
      `ok`, `mesh_cpp_builds`, `gen_cpp_works`, `strips_cpp_calls`, `light_cpp_pull_calls` (reported; 0 on normal boot — workers self-light in C++), `chunkio_cpp_slab_decodes`, `gd_strips_calls`, `gd_light_pull_calls`, `mesh_chunks`, `torch_placed`, `torch_light`, `roundtrip_ok`, `wall_ms`
    envs: —
    wall: ~1–2 s
    notes: |-
      AC-0208: `ok` = all five C++ counters > 0 AND both GDScript sentinels == 0 AND ≥16 mesh chunks AND torch placed + lit AND roundtrip ok. Companion: the fail-fast gate — rename `godot/bin/libchunkio.so` → the game must print the `AWECRAFT CANNOT START` banner + `push_error` and quit (restore the .so after)
  tick:
    entry: '`_tick_test`'
    tests: |-
      AC-0158 20 Hz Bedrock game-tick probe: settles the quiet r=4 41-diamond, then measures 120 ticks — clock rate, scope, random-tick distribution, determinism
    result_fields: |-
      `ok`, `hz2` (steady-state ≈ 20, last-half window), `cols` (41), `subchunks` (984), `min_count`/`max_count` (= window), `scope_bad` (0), `band123_ticks` (0), `recompute_mismatch` (0/118080), `window_md5` (byte-identical across fresh runs — `d81250cd…` at AC-0158/0164), `tick_ms_p95` (≈ 4–7), `region_ok` (spawn-predicate self-check), `queue_settled`
    envs: '`AWECRAFT_SEED`'
    wall: ~50 s (~22 s settle)
    notes: |-
      band-0 diamond ONLY ticks (far 13–50 never); the random-tick cell is a pure function of (world seed, tick index, column, subchunk) via splitmix64; full-window `hz` is dragged by catch-up drops on >200 ms frames — gate on `hz2`
  load:
    entry: '`_load_test`'
    tests: |-
      AC-0178 loading-screen + bypass-throttle first-load probe: fresh world at R=50 (7845 cols), measures the full first-load wall with the loading-bypass ON vs the spread (bypass OFF) baseline
    result_fields: |-
      `ok` (bypass ON completes), `bypass` (true/false), `cols` (7845), `disk`/`gen`/`meshed` (counters from provenance), `gen_per_s`/`mesh_per_s`, `wall_ms` (45-min in-arm cap), `loading_active_final`, `screen_up`, `spawn3x3_ms`, `tg_inflight`/`tm_inflight`, `queue_final` (band-3 data-only collar)
    envs: |-
      `AWECRAFT_SEED`, `AWECRAFT_LOADBYPASS` (1=on [default], 0=spread baseline), `AWECRAFT_RADIUS`
    wall: ~28 min ON / ≥45 min OFF (OFF does not finish)
    notes: |-
      **A/B gate: ON < OFF decisively** (ON completes 7845/7845 in ~27.6 min [gen/s 5.0]; OFF hits the 45-min cap at 7061/7845 [gen/s 3.0]). Loading paths are `loading_active`-gated — steady state keeps the legacy throttles (battery/chunkio/save/continue arms run with `loading_active=false`, values unchanged). Exit must be CLEAN: no `Pages in use … WorkerThreadPool GroupE`, no SCRIPT ERROR, no shutdown segfault (the group-consumption + `_exit_tree` poll-drain fixes)
  starlighttest:
    entry: '`_starlight_test` (AC-0283 P1)'
    tests: |-
      AweStarlight engine (gdext/src/starlight.cpp) vs the legacy AweLighting pull kernel, cell-by-cell: a hand-built single column (stone, torch-lit cave, lava pool, glowstone ceiling, sky shaft) + 3 edits (wall across the shaft, torch removed, lava→water) each vs the engine re-flood, plus the settled live region
    result_fields: |-
      `ok`, `mismatches` (0), `cells` (5,308,416), `synthetic_ok`/`edit_ok` (the synthetic column), `ready`/`base_ok`/`edit_ok` (the live region), `cur_us`/`sl_us` (kernel timings)
    envs: '`AWECRAFT_LOGIC=starlighttest`'
    wall: ~3–6 min
    notes: |-
      The P1 "near light exact" gate — the engine-equivalence proof; must stay 0 after any starlight.cpp or lane change. The legacy kernel (lighting.cpp) is the TEST-ONLY reference this arm compares against (AC-0283 P4)
  brightslab:
    entry: '`_brightslab_test` (AC-0283 P2, P5 star-native)'
    tests: |-
      Bright-slab-on-edit regression in a fully settled 7×7: C1 surface break, C2 cave-wall break letting sky in sideways, C3 torch place, C4 the 93→73 bake storm (the sanctioned FEED delta), C5 halo-boundary break, C6 probe — each edits, drives engine + remesh lane to a quiet world, then asserts three ways
    result_fields: |-
      per case: `name`, `engine_vs_ref` (0), `ref_vs_pull` (0), `mesh_vs_eng_bake` (0), `mesh_vs_pull_bake` (0), `max_bright_delta` (0.0); C4: `bakes` (73), `over_bright_max` (0), `lver_drops` (0); `ok` (all cases exact)
    envs: '`AWECRAFT_LOGIC=brightslab`'
    wall: ~2–3 min
    notes: |-
      The P2 edit-lane integration gate: settled star payload ≡ legacy pull reference on the POST-EDIT data, and the applied mesh ≡ the worker re-bake of BOTH payloads (geometry exact; colors within the ArrayMesh 8-bit step). C2/C5/C6 carry one documented under-lit ref quad each (the scoped-bake margin; the classic sky-carry v-channel is CORRECT there — do not "fix" it)
  halo:
    entry: '`_halo_test` (AC-0283 P3, AC-0286 promo block)'
    tests: |-
      Settled-world gate for the heightmap-sky far band + promotion/demotion lifecycle, render 6 (real taxi ≤ 4 + halo taxi 5; taxi ≥ 6 data-only): (a) every real column seeded+settled ≡ the legacy reference; (b) every halo column UNseeded and every applied 4×4 low mesh ≡ a fresh h_avg_emit on the arm-recomputed heightmap sky (15 strictly above the terrain top); (c) promotion of a known halo column — settled ≡ reference, single flood (seed-at-landing == 1), one enqueue per residency, retain-swap (0 promotion-originated hide late-landings); (d) demotion re-lowers the low
    result_fields: |-
      `a` {`seeded`, `settled`, `mismatches`, `boundary` (26 = the deep-corner under-lit-until-promotion class)}, `b` {192/192 byte-identical}, `c` {`seed` (1), `enq` (1), `land`, `late_landings_promo` (0)}, `d`; `ok`
    envs: '`AWECRAFT_LOGIC=halo`'
    wall: ~3–5 min
    notes: |-
      (a)'s 26 boundary mismatches are the documented under-lit-until-promotion class (the legacy reference sees far columns as holes; the arm fills them with the skip rule). The (c) promo block is the AC-0286 evidence (single flood + one promotion per residency + no hide)
  lightstate:
    entry: '`_lightstate_test` (AC-0273)'
    tests: |-
      Per-slab light-state canaries on an R16 moving camera: the slab's opaque-surface vertex colors keyed by quantized position (baked-light A/B — first landing vs edit rebuild), the double-LOD canary and the sky-wash census
    result_fields: |-
      `ok`, per-chunk `leaks`/`air_n`/`mean_eff`, `worst` {`chunk`,`cell`,`before`,`after`}, `double_lod` (0/0), `wash` (false), census deltas (documented timing)
    envs: '`AWECRAFT_LOGIC=lightstate`'
    wall: LONG — r16 class (~10–20 min, `--fixed-fps 600` convention)
    notes: |-
      The R16 canaries are EXACT across rebases (census deltas = documented timing, not drift): the AC-0283..0286 series keeps `double_lod` 0/0 and `wash` false
  ladder:
    entry: '`_ladder_test` (AC-0261, rebuilt at AC-0283 P3)'
    tests: |-
      Halo average-color ladder: small world (render 8, sim 2 — the real band taxi ≤ band0_r, taxi metric) — REAL [0, band0_r] = per-slab full meshes, the HALO band = 4×4×4 placeholder slabs; asserts the per-tier average colors are byte-identical across the emit paths + the boundary flip + the air checks
    result_fields: |-
      `ok`, `ab_ok` (avg-color A/B), `boundary_flip_ok`, `air_synth_ok`, `air_inworld_ok`, `tier0_ok`, `clutter_ok`, slab counts (966, of which 57 sky-mixed)
    envs: '`AWECRAFT_LOGIC=ladder`'
    wall: ~2–4 min
    notes: |-
      966==966 byte-identical across bands with only ms-timing deltas across rebases (the AC-0261 med/low ladder on the AC-0283 P3 halo band)
  meshprobe:
    entry: '`_meshprobe_test` (AC-0211)'
    tests: |-
      Mesh byte-identity probe: GDScript-side emit vs the C++ emit on the same inputs — full LOD + LOD quad-color checks (per-quad color from the normal/lighting model), vertex counts, atlas-rect coverage (the high mesh writes (0,0) for un-atlased LOD quads — reported, not gated)
    result_fields: |-
      `ok`, `match_rate` (1.0), `verts_gd`/`verts_cpp` (equal, >0), `n_samples` (≥8), `ae_pairs`/`ae_match` (atlas-edge pairs exact), `uv_repeat_ok`, `low_max_h_built`
    envs: '`AWECRAFT_LOGIC=meshprobe`'
    wall: ~1–2 min
    notes: |-
      1.0 invariant across the AC-0283..0286 series (mesh.cpp gained only `h_avg_emit`, which shares the emit core and is byte-identical to the slab emitter)
  farab:
    entry: '`_farab_test` (AC-0284b)'
    tests: |-
      FAR (h-only) column A/B battery: (a) skip-filled slabs (`generate_resl` skip=1 — the 284a shape, kept as the reference) through low_emit_avg vs (b) the far payload through `AweMesh.h_avg_emit` — identical grid inputs + fcc/sky must give byte-identical output; plus the v6 codec round-trip
    result_fields: |-
      `ok`, `cols` (984), `h_mismatch` (0), `slab_cmp` (984), `slab_mismatch` (0), `codec` {payload size ~198 B, round-trip exact}, `fcc_tiles`
    envs: '`AWECRAFT_LOGIC=farab`'
    wall: ~2–4 min
    notes: |-
      The AC-0284b invariant: the far H-only payload (H u16 + biome + top, v6 flag bit 1) emits byte-identical meshes — H is the heightmap and stays bit-exact with the full path so promotion never shifts terrain
  texrefresh:
    entry: '`_texrefresh_test` (AC-0297)'
    tests: |-
      Star-native tex-refresh: swap ONE atlas tile (grass top) through the real pack path (Data.apply_atlas + the tint re-bake) + world.refresh_textures(); then (1) the face-color cache changed, (2) the real column's HIGH slabs are byte-identical to the settled STAR payload re-build AND to their pre-swap mesh (a pixel-only atlas change leaves vertex data untouched), (3) the halo column's re-lowered LOW slabs are byte-identical to a FRESH h_avg_emit and the surface slab is provably different
    result_fields: |-
      `ok`, `slabs` (>0), `mism` (0), `surface_changed` (true), per-slab pre/post diffs
    envs: '`AWECRAFT_LOGIC=texrefresh`'
    wall: ~1–2 min
    notes: |-
      The AC-0297 gate: the tex-refresh dispatch is star-native (real = settled payload / halo = h_avg_emit). 7 slabs report "decomp_changed" (lossless per-face → merged quad decomposition — documented, not a failure)
