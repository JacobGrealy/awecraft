n circle → band 1 → skip 0) — an AC-0312 h-only representation violation (separate finding; a game-side fix would not clear (c) here since the landed data persists through the hop — follow-up ticket recommended, evidence chain in `tasks/AC-0334/AC-0334-results.html`). FIX (arm-side, invariant-based): the (c) reference now zeros glow sources (ids with glow > 0 → stone) in every NON-REAL column (taxi > band0_r) of the square — modeling the unseeded-halo contract instead of the column's transient data; soundness: the reference light is monotone and ≥ the engine's pointwise, so already-green cells carry no halo-glow term — the change touches exactly the red cells and nothing else (the rim-landing race resolves differently per run; the fix handles any resolution; `c.halo_glow_cells_zeroed` reports the count — 820 in the closing run). (c) now: mismatches 0, ref converged in 3 rounds**
