e-existing AC-0284b throwaway-camera noise. AC-0293 (2026-09-19): the 5x5 spawn burst — one of the surviving suspects (the uncapped 25-element burst group task) — is RETIRED; r16 all-sub-flag green on the burst-free tree, so the suspect list for AC-0323/AC-0328 narrows to the EditPool raw thread + engine pool internals. **AC-0331 (2026-09-19, the far-tier floor, `--fixed-fps 600`): ALL 12 sub-flags green (air/catch_up/gate/height/immediate/inr/low_sync_zero/low_thread/no_downgrade/no_giant/uv_repeat/wave). The floor prunes below-floor slabs from the far lanes — `far1` `far_visible` 556 → 391 (low 310 → 174, high 246 → 217, `far_holes` 0, `far_pending` 0 — still well above the `catch_up_ok` >100 threshold, no re-baseline owed), `low_enqueue_n` 47847 → 36057 (**−24.6%** — the dispatch census of the pruned low slabs, the ticket's named cost instrument), `inr4` holes 0 (air 37 → 334 / low 424 → 127 — pruned slabs settle as terminal air, the probes' floor-skip keeps them from re-dispatching), `demoted_cols_n` 421. The materialized-branch exemption in `_r16_lod_far` (a far column's slabs 0..6 are pruned, NOT holes) is what keeps `far_holes` 0**. **AC-0336 (the dead-lane deletion, `--fixed-fps 600`): the (off) fog wave, the in-r lane, and the band-drained order gate are GONE (dead since the AC-0335 one-scheduler unification) — RESULT fields dropped: `gate_ok` + its 4 counters (`gate_holds_n`/`high_before_low_n`/`high_before_low_firstbuild_n`/`gate_reclose_n`), `low_fog_boxes_n`, `far_fog`, `inr_fog`, `fog_created` (air_chunk_test), the pool `mm` key (the fog-box MultiMesh pool retired with the wave; `_pool_targets_for` is now `[mi, col]`). Sub-flags 12 → 11 (the `gate` flag is gone; all others keep their names and thresholds). The r16 idle-wait (`world._drain_units_last`) and the `--fixed-fps 600` convention are unchanged**
