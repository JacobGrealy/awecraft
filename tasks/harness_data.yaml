schema: 1
note: Single machine-readable source for the generated tables in godot/HARNESS.md. Render with tasks/scripts/harness_doc.py --render; verify with --check. Never hand-edit inside a BEGIN/END GENERATED marker in the doc.
mode_columns:
- mode
- harness entry
- what it tests (1 line)
- key RESULT fields
- envs
- typical wall (2026-08-24)
- notes
modes:
  player:
    entry: |-
      `_player_logic_test` (`_player_logic_test_body` in battery)
    tests: |-
      WASD move, floor, jump peak, fly toggle, time ticks
    result_fields: |-
      `start`, `after_fwd`, `horizontal_moved`, `is_on_floor`, `jump_peak_y`, `after_fly_y`, `time_before`, `time_after`
    envs: —
    wall: 3 s (standalone) / ~11 s battery (AC-0324)
    notes: |-
      battery smoke mode; AC-0324: waits the SIM BAND (`_await_sim_band`) so the spawn search is ready — the player spawns at the searched column (the pad centre while the pad exists; AC-0314 pending)
  spawnsearch:
    entry: '`_spawnsearch_test` (AC-0324)'
    tests: |-
      deterministic spawn search: per fresh world + sim-band wait, the chosen column's tier conditions re-derived independently (dry / slope over the 4 neighbour cells / un-veg feet+head), determinism (same seed twice → same column), real-player footing (is_on_floor + solid under the feet + no water), fallback tier consistency on the real band + synthetic T1/T2 tables through the pure core (`ChunkWorld._spawn_pick`)
    result_fields: |-
      `ok`, `per_seed` (seed, col, cell, top, pos, tier, tier_ok, det_same), `synthetic` (cases t0/t1/t2 + ok), `ms`
    envs: '`AWECRAFT_LOGIC=spawnsearch` (+ `AWECRAFT_SPAWN_SEEDS` override)'
    wall: ~25 s (3 seeds × 2 + synthetic)
    notes: |-
      AC-0324 gate (spec.html PROBE), seeds 44,1,7; BATTSKIP (a world per seed — out of battery scope); the SPAWNSEARCH line (col + surface H) also lands in the game log. AC-0314 (pad removal) re-run: ok true — all three seeds pick the NATURAL anchor column [8,8] as tier 0 (tops 141 / 148 / 200 — the searched position is the natural surface +1, no plateau anywhere)
  look:
    entry: '`_look_test`'
    tests: |-
      mouse-drag look deltas, pointer-lock behavior, no drag-mine
    result_fields: |-
      `yaw_after_drag`, `drag_yaw_delta`, `drag_pitch_delta`, `locked_yaw_delta`, `dragging`, `drag_mined`, `drag_yaw_ok`, `drag_pitch_ok`, `locked_yaw_ok`, `locked_pitch_ok`, `ok`
    envs: —
    wall: ~4 s (1 s, 2026-08-24, ok:true)
    notes: pointer-lock input via synthetic events
  interact:
    entry: |-
      `_interact_test` (`_interact_test_body` in battery)
    tests: |-
      DDA select, long-press mine → drop + pickup, place block
    result_fields: |-
      `target_cell`, `breakable_id`, `highlight_visible`, `after_mine_cell`, `drop_spawned`, `inv_grew`, `place_cell`, `after_place_cell`, `place_ok`
    envs: —
    wall: 3 s (standalone) / 1.3 s battery
    notes: 'known-stable: `drop_spawned`/`place_ok` true'
  craft:
    entry: '`_craft_test`'
    tests: |-
      shapeless 2×log→4 planks, table shaped pickaxe, inv bookkeeping
    result_fields: |-
      `ok`, `data` (r: `logs_start`, `out_a`, `planks_a`, …), `inv` (Debug.inv_dump), `armor` (Debug.armor_dump)
    envs: —
    wall: |-
      ~15–30 s (not re-run 08-24; long scripted UI sequence)
    notes: slow-ish UI mode
  guiclick:
    entry: '`_guiclick_test`'
    tests: |-
      inventory click/drag routing, held grab/drop, real recipe click (E planks, table pickaxe)
    result_fields: |-
      `ok`, `data` (r: `held0`, `held_down`, `hot0_up`, `two_click`, `drop_hot0`, `drop_storage`, + real-recipe keys)
    envs: —
    wall: ~15–30 s (not re-run 08-24)
    notes: AC-0059 gate
  combat:
    entry: '`_combat_test`'
    tests: |-
      bare-hand punch 1 dmg, attack cooldown, sword 4 dmg, mob death drops, no-target safe
    result_fields: |-
      `bare`, `bare_hp`, `post_double_hp`, `cooldown_ok`, `weapon_dmg`, `death_drops`, `death_ok`, `no_target`, `ok`
    envs: —
    wall: ~10–20 s (not re-run 08-24)
    notes: spawns mobs
  swing:
    entry: '`_swing_test`'
    tests: |-
      swing-by-rotation (AC-0085): single-axis pitch arc, punch, 0.9 s loop cycles, tool voxel render, tier tint, walk sway/bob
    result_fields: |-
      `ok`, `data` (r: `saw_mid_swing`, `mid_frac`, `swing_max_rot` (>0.4, ≈0.85), `settled`, `punch_max_rot`, `loop_cycles_0.9s` (3–5), `tool_111..123`, `tier_differs_111_vs_113`, `fist_after_empty`, `walk_bobs` (4–10), `walk_y_crossings`, `walk_idle_max_off`)
    envs: —
    wall: ~15 s (not re-run 08-24)
    notes: post-AC-0085 asserts rotation not position
  survival:
    entry: '`_survival_test`'
    tests: |-
      tool vs bare mine speed, gated drops, armor DR, hunger drain/regen/starve, eat, respawn
    result_fields: |-
      `tool_ratio` (frame-based, bare/pick frames-to-break), `bare_frames`, `pick_frames`, `bare_ms`, `pick_ms`, `drop_bare`, `drop_pick`, `dmg_none`, `dmg_armor`, `hunger_drain`, `hunger_mine`, `hunger_regen`, `starve`, `eat`, `respawn`, `dump`, `ok`
    envs: —
    wall: ~60–120 s (re-run 09-18 resume, green 44/1/7)
    notes: long survival sequence; AC-0314 resume - builds its own 5x5 flat stone fixture via set_block (spawn pad gone; natural terrain has no guaranteed flat 3x3, the old inline search bailed); stander ON the slab (feet=ctop+1) + target at eye level (y=ctop+2) so the horizontal aim clears the slab (the old pad-era aim embedded the capsule in the slab top block and settled the player below it); tool_ratio now frame-based (deterministic; the wall-ms ratio wandered 2.15-2.27 and flipped the tol assertion on borderline seeds); full assertion set re-run green on seeds 44/1/7
  hunger:
    entry: '`_hunger_toggle_test`'
    tests: |-
      hunger_enabled off pins 20 + regen intact; on → starve damage
    result_fields: |-
      `pin_to_full`, `off` {`hunger`,`min_hp`,`regen_gain`,`regen_ms`,`attack_cost_zero`}, `on` {`starve_dmg`,`starve_ms`}, `ok`
    envs: —
    wall: ~20–40 s (not re-run 08-24)
    notes: AC-0063 gate; AC-0314 resume - builds its own 5x5 flat stone fixture via set_block (spawn pad gone; the old inline search bailed); full assertion set re-run on seeds 44/1/7
  light:
    entry: '`_light_test`'
    tests: |-
      sky light bake: surface 15, cave 0, torch level 14, BFS reach
    result_fields: |-
      `surface_eff` (15), `cave_eff` (0), `torch_level` (14), `torch_far_before` (0), `torch_far_after` (9)
    envs: —
    wall: 4 s (standalone) / 2.9 s battery
    notes: known-stable
  daynight:
    entry: '`_daynight_test`'
    tests: |-
      sun energy/sky color at t=0.25 vs 0.75, full cycle period
    result_fields: |-
      `time_025`, `time_075` (DayNight readouts), `cycle_elapsed_ms`, `cycle_expected`, `cycle_actual`, `cycle_delta_ok`, `colcheck`, `ok`
    envs: '`AWECRAFT_TIME`'
    wall: ~30–60 s (not re-run 08-24)
    notes: runs a full day cycle
  tint:
    entry: '`_tint_test`'
    tests: |-
      per-block vertex tint (tinted vs untinted surface samples)
    result_fields: '`ok`, `samples` (out)'
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: ''
  settings:
    entry: '`_settings_test`'
    tests: |-
      settings defaults 50/4 (sim), ranges 4–96, sim→render clamp, load clamp, the AC-0313 sim floor (SIM_MIN 4: set 3 → 4, stored 2 → 4 on load), apply, volume, hunger toggle (AC-0072)
    result_fields: |-
      `defaults`, `range`, `sim_clamp`, `load_clamp`, `apply` (dist rebase [7,64] at AC-0313), `sim_floor` {saved 2, after_load 4}, `volume_ok`, `hunger` {saved_off, reloaded_off, back_on, default_true}, `ok`
    envs: '`AWECRAFT_IGNORE_SETTINGS` (self-managed)'
    wall: ~5 s (not re-run 08-24; fast class)
    notes: |-
      dispatched at main.gd:576 BEFORE game nodes (works standalone + in battery). AC-0313: SIM_MIN 1→4 (the tier-0 set went, the real band taxi ≤ sim is the footing guarantee) — the apply dist expectation rebased [7,48]→[7,64] (sim 3 → floor 4) and the new `sim_floor` field round-trips the floor through the load path
  fluids:
    entry: '`_fluids_test`'
    tests: |-
      source stability, level-7 sideways spread, water+lava reactions, sea zero-write invariant
    result_fields: |-
      `shore_after` ([5,7]), `source_after` ([5,8]), `water_delta` (1), `water_on_lava_result` (25), `sideways_lava_result` (9), `sea_stable` (true), `sea_surface_before`/`_final` (2756), `sea_backed_before`/`_final` (914); prints `FLUIDSTAT` line
    envs: —
    wall: 5 s (standalone) / 3.8 s battery
    notes: |-
      known-stable; AC-0068 invariant; sea counters are the count over `world.chunks.keys()` — AC-0152/0160 changed the r4 resident set (121→69 chunks) → new baseline 2756/914 (old 2730/888 VOID)
  fluidprobe:
    entry: '`_fluidprobe_test`'
    tests: probes water column positions (debug scout)
    result_fields: '`done` (true)'
    envs: —
    wall: ~5 s (not re-run 08-24)
    notes: ''
  fluidfall:
    entry: '`_fluidfall_test`'
    tests: |-
      AC-0068: source over hole stationary (0 writes), descending column lands + 7-wide spread, flat pool shore
    result_fields: |-
      `sy`, `caseA_source`, `caseB_full`, `caseC_flat`, `shore`, `far`, `beyond`, `center`, `caseA_ok`, `caseB_ok`, `caseC_ok`, `ok`
    envs: '`AWECRAFT_SETTLE_TICKS` (forces hard settle)'
    wall: ~10 s (not re-run 08-24)
    notes: r=2 forced
  webfall:
    entry: '`_webfall_test`'
    tests: |-
      web-fall parity: settled + landed + floor spread ≥100 cells
    result_fields: |-
      `settled`, `landed`, `floor_cells`, `total_water`, `sy`, `ok`
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: r=2 forced
  fluidsettle:
    entry: '`_fluidsettle_test`'
    tests: |-
      world-wide fluid settle: ticks to quiescence, final water count
    result_fields: |-
      `ticks_to_settle`, `quiet`, `water_final`, `chunk_count`
    envs: '`AWECRAFT_SETTLE_TICKS`'
    wall: ~10–20 s (not re-run 08-24)
    notes: ''
  buckets:
    entry: |-
      `_buckets_test` (`_buckets_test_body` in battery)
    tests: bucket scoop water → item 140, place back
    result_fields: |-
      `scoop_before`, `after_scoop`, `inv_scoop`, `place_after`, `inv_place`
    envs: —
    wall: |-
      ~5 s (standalone, not re-run 08-24) / ~3 s battery
    notes: battery full mode (not in 08-24 smoke)
  water:
    entry: '`_water_test`'
    tests: |-
      player water-column physics: rise to shore top, land on shore, water cell intact
    result_fields: |-
      `B`, `shore_top`, `timeline`, `max_y`, `first_above_frame`, `above_top`, `landed_frame`, `standing_on_shore`, `final`, `final_on_floor`, `water_cell_intact`, `ok`
    envs: —
    wall: ~20 s (not re-run 08-24)
    notes: ''
  fpv:
    entry: '`_fpv_test`'
    tests: |-
      first-person view atlas UVs in range, grass top/side distinct
    result_fields: |-
      `has_uv`, `uv_min`, `uv_max`, `uv_in_range`, `grass_top`, `grass_side`, `grass_distinct`
    envs: —
    wall: ~5 s (not re-run 08-24)
    notes: ''
  held:
    entry: '`_held_test`'
    tests: |-
      held block box vs cross sprite visibility (AC-0066 fidelity)
    result_fields: |-
      `ok`, `block_held_ok`, `block_visible`, `block_type_ok`, `sprite_hidden_during_block`, `region_actual`, `region_want`, `tool_held_ok`, `tool_visible`, `tool_type_ok`, `empty_hidden_ok`
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: ''
  toolres:
    entry: '`_toolres_test`'
    tests: |-
      tool voxel model resolution: 5 tools present + type + tier color + box/fist fallback
    result_fields: |-
      `ok`, `tool_111`/`115`/`119`/`123`/`113` {`present`,`type`,`fist`,`sprite`,`box`,`ok`}, `headcolor_111`/`headcolor_113`, `tier_differs_111_vs_113`, `box_after_tool`, `fist_after_empty`
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: AC-0070 gate
  toolpose:
    entry: '`_toolpose_test`'
    tests: |-
      tool orientation + scale ×2 + depth-disable (AC-0073/0067/0085)
    result_fields: |-
      `ok`, `held_box_scale_x` (≈0.70), `held_sprite_scale_x`, `scale_ok`, `tool_…` {`position_ok`,`arc_ok`,`vertical_ok`,`handle_below_cam`,`bbox_diag`,`diag_2x_ok`,`depth_disabled`,`ok`}, `depth` {tool,box,fist,sprite}, `depth_ok`
    envs: —
    wall: ~15 s (not re-run 08-24)
    notes: handle y < −0.55
  viewmodel:
    entry: '`_viewmodel_shot`'
    tests: |-
      AC-0085 render hook: idle/apex head+handle centroids for a held tool
    result_fields: |-
      `vmshot`, `frac`, `idle_head`, `idle_handle`, `apex_head`, `apex_handle`
    envs: |-
      `AWECRAFT_VMITEM`, `AWECRAFT_VMSHOT`, `AWECRAFT_VMFRACTION`
    wall: ~10 s headless (render hook; xvfb for the shot)
    notes: centroid-only in headless
  wallshot:
    entry: '`_wallshot_test`'
    tests: |-
      AC-0067 on-top: held box/sprite vs stone wall pixel regions (before/after)
    result_fields: |-
      `before`, `shots`, `wall_face_z`, `block` {`block_frame_stone`,`block_vm_nonstone`,`block_box_vis`,`block_depth_on`}, `item` {`item_vm_cyan`,`item_sprite_vis`}
    envs: |-
      `AWECRAFT_WALL_BEFORE` (1), `AWECRAFT_WALL_SHOTS`, `AWECRAFT_SNAPSHOT` (paths)
    wall: render mode (~300 s timeout)
    notes: xvfb; writes shots into `tasks/AC-0067/`
  editperf:
    entry: '`_editperf_test`'
    tests: |-
      single block edit: flush frames, build cost, no hitch
    result_fields: |-
      `cell`, `edited_id`, `cell_after`, `flush_done`, `flush_frames`, `max_frame_build_ms`, `single_build_ms`, `total_ms`
    envs: —
    wall: ~5–10 s (not re-run 08-24)
    notes: ''
  perf:
    entry: '`_perf_test`'
    tests: |-
      full-radius build/drain/first-draw/frame percentiles + memory
    result_fields: |-
      `chunks`, `render_radius`, `fog_near`/`fog_far`/`fog_edge`/`fog_ok`, `total_chunks`, `all_meshed`, `collision_shapes`, `total_ms`, `frames`, `recenter_ms`, `max_frame_ms`, `build_units`, `drain_frames`, `max_drain_ms`, `gen_ms`, `build_ms`, `first_draw_ms`, `p50_ms`, `p95_ms`, `frame_max_ms`, `mem_before_bytes`, `mem_after_bytes`, `drain_s`
    envs: |-
      `AWECRAFT_RADIUS`, `AWECRAFT_THREADGEN_N`/`TGDEBUG`, `AWECRAFT_RECPROBE`, `AWECRAFT_DRAIN_MS`, `AWECRAFT_GEN_BUDGET`, `AWECRAFT_MESH_INFO`
    wall: |-
      r4 ≈12.3 s total_ms (measured `.scratch/ac0082_g4_perf_r4_t1.log` 2026-08-24); **r50 ≈850 s total_ms (from 2026-08-24 03:25 log `ac0082_g4_perf_r50_t1.log`)**
    notes: SLOW at r50 — use 3000 s timeout
  boundary:
    entry: '`_boundary_test` (via `_await_boundary_core`)'
    tests: |-
      chunk streaming: walk r chunks, crossings, bursts, forward/trailing wall, mem, marker round-trip
    result_fields: |-
      `ok`, `radius`, `walk_chunks`, `walk_speed`, `walk_s`, `crossings`, `p50_ms`, `p95_ms`, `max_ms`, `loads`, `unloads`, `flap`, `burst_ms_per_crossing`, `burst_p50_ms`, `burst_p95_ms`, `burst_max_ms`, `forward_wall_ms_per_crossing`, `forward_p95_ms`, `forward_max_ms`, `trailing_*`, `fluid_tick_ms_p95`, `mem_delta_mb`, `marker`, `marker_ok`, `remesh_ok`, `resident_final`, `built_final`, `in_radius_built_final`/`_max`/`_min`, `in_radius_present_final`, `target_in_radius`
    envs: |-
      `AWECRAFT_RADIUS` (r), `AWECRAFT_WALK`, `AWECRAFT_WALK_SPEED`, `AWECRAFT_TICKTIME`, `AWECRAFT_THREADGEN_N`/`TGDEBUG`, `AWECRAFT_RECPROBE`
    wall: |-
      r3 45 s, r4 46 s (measured 2026-08-24); r50 ≈1400 s wall (from 2026-08-24 10:34 log `.scratch/ac0079r3_battery/b_r50.log`)
    notes: |-
      SLOW at r≥8 — 3000 s timeout; fluid sim enabled. **Off-default walk speeds read RED for a budget reason, not a world bug** — `ok = crossings == walk_lines and marker_ok` and the walk line is a fixed length, so at `AWECRAFT_WALK_SPEED=8` the arm needs ~2× the wall and finishes fewer crossings than `walk_lines` (measured 2026-09-17 at AC-0313: 7 crossings, `ok:false`, while the same run's world values were clean — p50 14, p95 21, `marker_ok`/`remesh_ok` true). Judge off-default runs on the p50/p95/`*_final` fields, not on `ok`.
  atlas:
    entry: '`_atlas_test`'
    tests: spawn chunk mesh UV sanity
    result_fields: '`ok` (or `error`)'
    envs: —
    wall: ~5 s (not re-run 08-24)
    notes: ''
  r16:
    entry: '`_r16_test` (AC-0212, rebased at AC-0313, 3-tier rebase at AC-0312)'
    tests: |-
      16-radius build + moving inside a chunk: per-frame CPU in static vs moving phases (frame ms → effective fps), camera on a 12 m circle inside the spawn chunk (frustum changes every frame). AC-0312 pins: sim 4 / medium_start 5 / low_start 10 / render 16 → REAL [0,4], band A taxi 5 (materialized high), band B 6-10, band C 11-15; the band-A materialization runs in the drain high lane in parallel (NOT part of the real-band gate); the per-slab grid-vs-mesh check reads the LIVE grid at the stored DRAW tier (G=8 tier 2 / G=4 tier 3)
    result_fields: |-
      `ok` (measurement arm — hardcoded true; the sub-flags are the contract), `radius` (16), `ho_cap`, `built`/`built_all`/`total_chunks`, `resident`, `build_ms`, `cull_mode`, `perf_cull_passes`/`perf_cull_flips`, `static`/`moving` {`n`,`p50_ms`,`p95_ms`,`max_ms`,`fps_*`}, `drop_fps_static_vs_moving`, `lod` {`gate_ok` (band_drained build gate), `inr_ok`/`inr4` (inner-ring holes/pending 0), `wave_ok`, `height_ok`, `no_giant_ok`, `no_downgrade_ok`, `low_thread_ok`, `immediate_ok`, `low_sync_zero_ok`, `air_ok`, `far_low_n` (the payload lows — grid checks skipped, byte-gated by farab), `uv_repeat_ok`}, `gen_timing` {`cols_skip` (the band-A materialization census — NOT dead), `cols_far`, `cols_full`}, `section_first_ok`
    envs: |-
      `AWECRAFT_FRUSTUM` (engine [default] / manual / 0), `AWECRAFT_RADIUS` (forced ≥16 by the arm)
    wall: |-
      LONG — run `--fixed-fps 600` so ticks are uncapped and the frame-ms awaits measure true per-frame CPU (same convention as breakspike); ~3–8 min wall (r16 build, 25-min in-arm cap, proceeds on partial build)
    notes: |-
      AC-0212 #1 gate: A/B `AWECRAFT_FRUSTUM=manual` vs default engine — no 5 fps drop in the moving phase. AC-0313: sim pin 2 → 4, medium_start 4 → 5 (real band [0,2] → [0,4]). AC-0312 3-tier rebase: the low band is now the FAR payload (band B/C) — the per-slab grid-vs-mesh check skips far slabs (`far_low_n`; their emit identity is farab's byte gate, 1080/1080 @ G=4/G=8 + water) and `uv_repeat_ok` counts them; `air_ok` skips the far columns' null slabs (the payload low is the designed state). Measured (2026-09-18, final run): ALL sub-flags green — `gate_ok`/`inr_ok`/`wave_ok`/`height_ok`/`no_giant_ok`/`no_downgrade_ok`/`low_thread_ok`/`immediate_ok`/`low_sync_zero_ok`/`air_ok`/`uv_repeat_ok` true, `inr4` {holes 0, pending 0}, `uv_mismatch` 0/0 (the 4292/456 low slabs are all far payload — `far_low_n`), `cols_skip` 130 / `cols_far` 1647 / `cols_full` 642, `built_all` true, `section_first_ok` true. **AC-0329 (OPEN) OWNS THE CURRENT STATE:** on the post-AC-0314 tree the coordinator re-ran this arm with the documented `--fixed-fps 600` recipe TWICE and got `air_ok` FALSE (`air_with_lod` 3), `uv_repeat_ok` FALSE (`uv_mismatch` 262/271 quads, ~2120 `uv_stale_slabs`) and `catch_up_ok` FALSE, with `cols_skip` ~473 vs the 130 recorded here - PERSISTENT, not a transient; every other sub-flag stays green. The arm's top-level `ok` is HARDCODED true (below), so read the sub-flags, never `ok`, and always with `--fixed-fps 600`. A mid-series run showed a 379-quad `uv_mismatch` on non-far capsule slabs (a keep-all-LOD co-stored payload-era low compared against the new full-data grid — a timing transient; it did not reproduce in the final run). KNOWN CRASH CLASS (bounded by AC-0323 - and it is NOT a flake of this arm): a rare intermittent SIGSEGV (~1 in 10 under heavy streaming load) whose Godot crash handler prints an EMPTY backtrace; the identical banner plus the single frame `libc.so.6(+0x45f60)` (the `rt_sigreturn` stub, i.e. the fault lands ON the signal frame) appears in logs from 2026-09-06 onward (.scratch/ac0231-r16-inrpass.log, ac0236-bat-smoke.log, batt192.log), so it predates the far-band work by ~90 tickets; 43 runs on the 2026-09-18 tree were clean. AC-0323 holds the eliminations (small stacks, OOM, the throwaway-camera cull path, steady-state lane concurrency - all cleared) and the surviving suspects (the uncapped 25-element burst group task, the EditPool raw thread, engine pool internals incl. the statically linked Rust runtime); AC-0328 is the long reproduction campaign. The `!is_inside_tree` warning (272/run) is the pre-existing AC-0284b throwaway-camera noise
  spin:
    entry: '`_spin_test` (AC-0109 G1; row added at AC-0212)'
    tests: |-
      360° spin: no on-screen flicker (`transitions` 0), verts drop looking sideways, all-chunks-restore, queue flat.
    result_fields: |-
      **AC-0212: cull-lane aware** — `cull_mode`=`engine` (default) replicates the render server's exact per-instance AABB-vs-frustum test (no margin) instead of reading `.visible`; `manual` keeps the legacy `.visible` read. New RESULT: `cull_mode`, `manual_pass`, `perf_cull_passes`, `perf_cull_flips`, `instances_total`, `instances_hidden`
    envs: '`AWECRAFT_FRUSTUM`'
    wall: ~30–60 s (r4 build + 121 steps)
    notes: |-
      `ok` = transitions==0 + verts_drop + vis_end==vis_start + queue_flat
  genhash:
    entry: '`_genhash_print`'
    tests: |-
      5×5 (25) chunk data-gen MD5 parity — world/* change gate
    result_fields: |-
      prints `GENHASH cx cz <32-hex>` ×25 + `GENMS` (no RESULT dict)
    envs: '`AWECRAFT_SEED` (default 44)'
