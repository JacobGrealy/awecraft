schema: 1
note: Single machine-readable source for the generated tables in godot/HARNESS.md. Render with tasks/scripts/harness_doc.py --render; verify with --check. Never hand-edit inside a BEGIN/END GENERATED marker in the doc.
mode_columns:
- mode
- harness entry
- what it tests (1 line)
- key RESULT fields
- envs
- typical wall (2026-08-24)
- notes
modes:
  player:
    entry: |-
      `_player_logic_test` (`_player_logic_test_body` in battery)
    tests: |-
      WASD move, floor, jump peak, fly toggle, time ticks
    result_fields: |-
      `start`, `after_fwd`, `horizontal_moved`, `is_on_floor`, `jump_peak_y`, `after_fly_y`, `time_before`, `time_after`, `col_deferred_in_footprint` (AC-0340 fence tripwire — 0)
    envs: —
    wall: 3 s (standalone) / ~11 s battery (AC-0324)
    notes: |-
      battery smoke mode; AC-0324: waits the SIM BAND (`_await_sim_band`) so the spawn search is ready — the player spawns at the searched column (the pad centre while the pad exists; AC-0314 pending). **AC-0340: `col_deferred_in_footprint` (the collision-budget fence tripwire — the player arm stands/walks/jumps near the spawn column (0,0) and must read 0).** STALE-VALUE FINDING (2026-09-20, AC-0340 before-run, deterministic on HEAD 5be1c78): the post-cave-terrain spawn area (AC-0288/0289 re-carved it AFTER the values below were last re-measured 2026-09-18) now has a cave opening on the arm's compass scan line — the player walks in and falls to the cave floor (`jump_peak_y` 110.33 vs the recorded 142.43, `sprint_ok` false, `is_on_floor` false at the probe; the AC-0264 PROBE line shows every slab under the fallen position WITH a body — a genuine air hole, not a missing body). The arm carries no `ok` field so the battery `ok` is unaffected; the recorded start/jump values are STALE pending re-measure (arm-side staleness, follow-up)
  spawnsearch:
    entry: '`_spawnsearch_test` (AC-0324)'
    tests: |-
      deterministic spawn search: per fresh world + sim-band wait, the chosen column's tier conditions re-derived independently (dry / slope over the 4 neighbour cells / un-veg feet+head), determinism (same seed twice → same column), real-player footing (is_on_floor + solid under the feet + no water), fallback tier consistency on the real band + synthetic T1/T2 tables through the pure core (`ChunkWorld._spawn_pick`)
    result_fields: |-
      `ok`, `per_seed` (seed, col, cell, top, pos, tier, tier_ok, det_same), `synthetic` (cases t0/t1/t2 + ok), `ms`
    envs: '`AWECRAFT_LOGIC=spawnsearch` (+ `AWECRAFT_SPAWN_SEEDS` override)'
    wall: ~25 s (3 seeds × 2 + synthetic)
    notes: |-
      AC-0324 gate (spec.html PROBE), seeds 44,1,7; BATTSKIP (a world per seed — out of battery scope); the SPAWNSEARCH line (col + surface H) also lands in the game log. AC-0314 (pad removal) re-run: ok true — all three seeds pick the NATURAL anchor column [8,8] as tier 0 (tops 141 / 148 / 200 — the searched position is the natural surface +1, no plateau anywhere). AC-0288 (cave P0 tune) re-run: ok true, same anchor column + tier 0 for all seeds; seed 1's top 148 → **147** (its heightmap H is 146 — the reported top is the EFFECTIVE surface, and the tuned cave field wobbles it H+1 instead of H+2, inside the documented H±R surface band; the heightmap itself is byte-identical — see the genhash row). Tops now 141 / 147 / 200
  look:
    entry: '`_look_test`'
    tests: |-
      mouse-drag look deltas, pointer-lock behavior, no drag-mine
    result_fields: |-
      `yaw_after_drag`, `drag_yaw_delta`, `drag_pitch_delta`, `locked_yaw_delta`, `dragging`, `drag_mined`, `drag_yaw_ok`, `drag_pitch_ok`, `locked_yaw_ok`, `locked_pitch_ok`, `ok`
    envs: —
    wall: ~4 s (1 s, 2026-08-24, ok:true)
    notes: pointer-lock input via synthetic events
  interact:
    entry: |-
      `_interact_test` (`_interact_test_body` in battery)
    tests: |-
      DDA select, long-press mine → drop + pickup, place block
    result_fields: |-
      `target_cell`, `breakable_id`, `highlight_visible`, `after_mine_cell`, `drop_spawned`, `inv_grew`, `place_cell`, `after_place_cell`, `place_ok`
    envs: —
    wall: 3 s (standalone) / 1.3 s battery
    notes: 'known-stable: `drop_spawned`/`place_ok` true'
  craft:
    entry: '`_craft_test`'
    tests: |-
      shapeless 2×log→4 planks, table shaped pickaxe, inv bookkeeping
    result_fields: |-
      `ok`, `data` (r: `logs_start`, `out_a`, `planks_a`, …), `inv` (Debug.inv_dump), `armor` (Debug.armor_dump)
    envs: —
    wall: |-
      ~15–30 s (not re-run 08-24; long scripted UI sequence)
    notes: slow-ish UI mode
  guiclick:
    entry: '`_guiclick_test`'
    tests: |-
      inventory click/drag routing, held grab/drop, real recipe click (E planks, table pickaxe)
    result_fields: |-
      `ok`, `data` (r: `held0`, `held_down`, `hot0_up`, `two_click`, `drop_hot0`, `drop_storage`, + real-recipe keys)
    envs: —
    wall: ~15–30 s (not re-run 08-24)
    notes: AC-0059 gate
  combat:
    entry: '`_combat_test`'
    tests: |-
      bare-hand punch 1 dmg, attack cooldown, sword 4 dmg, mob death drops, no-target safe
    result_fields: |-
      `bare`, `bare_hp`, `post_double_hp`, `cooldown_ok`, `weapon_dmg`, `death_drops`, `death_ok`, `no_target`, `ok`
    envs: —
    wall: ~10–20 s (not re-run 08-24)
    notes: spawns mobs
  swing:
    entry: '`_swing_test`'
    tests: |-
      swing-by-rotation (AC-0085): single-axis pitch arc, punch, 0.9 s loop cycles, tool voxel render, tier tint, walk sway/bob
    result_fields: |-
      `ok`, `data` (r: `saw_mid_swing`, `mid_frac`, `swing_max_rot` (>0.4, ≈0.85), `settled`, `punch_max_rot`, `loop_cycles_0.9s` (3–5), `tool_111..123`, `tier_differs_111_vs_113`, `fist_after_empty`, `walk_bobs` (4–10), `walk_y_crossings`, `walk_idle_max_off`)
    envs: —
    wall: ~15 s (not re-run 08-24)
    notes: post-AC-0085 asserts rotation not position
  survival:
    entry: '`_survival_test`'
    tests: |-
      tool vs bare mine speed, gated drops, armor DR, hunger drain/regen/starve, eat, respawn
    result_fields: |-
      `tool_ratio` (frame-based, bare/pick frames-to-break), `bare_frames`, `pick_frames`, `bare_ms`, `pick_ms`, `drop_bare`, `drop_pick`, `dmg_none`, `dmg_armor`, `hunger_drain`, `hunger_mine`, `hunger_regen`, `starve`, `eat`, `respawn`, `dump`, `ok`
    envs: —
    wall: ~60–120 s (re-run 09-18 resume, green 44/1/7)
    notes: long survival sequence; AC-0314 resume - builds its own 5x5 flat stone fixture via set_block (spawn pad gone; natural terrain has no guaranteed flat 3x3, the old inline search bailed); stander ON the slab (feet=ctop+1) + target at eye level (y=ctop+2) so the horizontal aim clears the slab (the old pad-era aim embedded the capsule in the slab top block and settled the player below it); tool_ratio now frame-based (deterministic; the wall-ms ratio wandered 2.15-2.27 and flipped the tol assertion on borderline seeds); full assertion set re-run green on seeds 44/1/7
  hunger:
    entry: '`_hunger_toggle_test`'
    tests: |-
      hunger_enabled off pins 20 + regen intact; on → starve damage
    result_fields: |-
      `pin_to_full`, `off` {`hunger`,`min_hp`,`regen_gain`,`regen_ms`,`attack_cost_zero`}, `on` {`starve_dmg`,`starve_ms`}, `ok`
    envs: —
    wall: ~20–40 s (not re-run 08-24)
    notes: AC-0063 gate; AC-0314 resume - builds its own 5x5 flat stone fixture via set_block (spawn pad gone; the old inline search bailed); full assertion set re-run on seeds 44/1/7
  light:
    entry: '`_light_test`'
    tests: |-
      sky light bake: surface 15, cave 0, torch level 14, BFS reach
    result_fields: |-
      `surface_eff` (15), `cave_eff` (0), `torch_level` (14), `torch_far_before` (0), `torch_far_after` (9)
    envs: —
    wall: 4 s (standalone) / 2.9 s battery
    notes: known-stable
  daynight:
    entry: '`_daynight_test`'
    tests: |-
      sun energy/sky color at t=0.25 vs 0.75, full cycle period
    result_fields: |-
      `time_025`, `time_075` (DayNight readouts), `cycle_elapsed_ms`, `cycle_expected`, `cycle_actual`, `cycle_delta_ok`, `colcheck`, `ok`
    envs: '`AWECRAFT_TIME`'
    wall: ~30–60 s (not re-run 08-24)
    notes: runs a full day cycle
  tint:
    entry: '`_tint_test`'
    tests: |-
      per-block vertex tint (tinted vs untinted surface samples)
    result_fields: '`ok`, `samples` (out)'
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: ''
  settings:
    entry: '`_settings_test`'
    tests: |-
      settings defaults 50/4 (sim), ranges 4–96, sim→render clamp, load clamp, the AC-0313 sim floor (SIM_MIN 4: set 3 → 4, stored 2 → 4 on load), apply, volume, hunger toggle (AC-0072), the AC-0332 far-tier floor pair (defaults on/0, the 0..24 clamp, toggle round-trip, the set_value apply step via the stub's note_yfloor, the Developer-tab row's presence from the real menu scene + the _sync_controls refresh)
    result_fields: |-
      `defaults`, `range`, `sim_clamp`, `load_clamp`, `apply` (dist rebase [7,64] at AC-0313), `sim_floor` {saved 2, after_load 4}, `volume_ok`, `hunger` {saved_off, reloaded_off, back_on, default_true}, `yfloor` {default_on_0, clamp_hi_24, clamp_lo_0, toggle_off_on, apply_step, apply_calls, dev_row_present, sync_set5, toggle_dim}, `ok`
    envs: '`AWECRAFT_IGNORE_SETTINGS` (self-managed)'
    wall: ~5 s (not re-run 08-24; fast class)
    notes: |-
      dispatched at main.gd:576 BEFORE game nodes (works standalone + in battery). AC-0313: SIM_MIN 1→4 (the tier-0 set went, the real band taxi ≤ sim is the footing guarantee) — the apply dist expectation rebased [7,48]→[7,64] (sim 3 → floor 4) and the new `sim_floor` field round-trips the floor through the load path. AC-0332 (2026-09-19): the far-tier mesh floor pair (yfloor_enabled + yfloor_chunks_below_sea) is covered — the apply step rides set_value (Settings.apply_yfloor -> the world's note_yfloor, stub-counted) and the dev-row presence instantiates scenes/menu.tscn (synchronous _ready; the arm stays await-free by contract)
  fluids:
    entry: '`_fluids_test`'
    tests: |-
      source stability, level-7 sideways spread, water+lava reactions, sea zero-write invariant
    result_fields: |-
      `shore_after` ([5,7]), `source_after` ([5,8]), `water_delta` (1), `water_on_lava_result` (25), `sideways_lava_result` (9), `sea_stable` (true), `sea_surface_before`/`_final` (2756), `sea_backed_before`/`_final` (914); prints `FLUIDSTAT` line
    envs: —
    wall: 5 s (standalone) / 3.8 s battery
    notes: |-
      known-stable; AC-0068 invariant; sea counters are the count over `world.chunks.keys()` — AC-0152/0160 changed the r4 resident set (121→69 chunks) → new baseline 2756/914 (old 2730/888 VOID)
  fluidprobe:
    entry: '`_fluidprobe_test`'
    tests: probes water column positions (debug scout)
    result_fields: '`done` (true)'
    envs: —
    wall: ~5 s (not re-run 08-24)
    notes: ''
  fluidfall:
    entry: '`_fluidfall_test`'
    tests: |-
      AC-0068: source over hole stationary (0 writes), descending column lands + 7-wide spread, flat pool shore
    result_fields: |-
      `sy`, `caseA_source`, `caseB_full`, `caseC_flat`, `shore`, `far`, `beyond`, `center`, `caseA_ok`, `caseB_ok`, `caseC_ok`, `ok`
    envs: '`AWECRAFT_SETTLE_TICKS` (forces hard settle)'
    wall: ~10 s (not re-run 08-24)
    notes: r=2 forced
  webfall:
    entry: '`_webfall_test`'
    tests: |-
      web-fall parity: settled + landed + floor spread ≥100 cells
    result_fields: |-
      `settled`, `landed`, `floor_cells`, `total_water`, `sy`, `ok`
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: r=2 forced
  fluidsettle:
    entry: '`_fluidsettle_test`'
    tests: |-
      world-wide fluid settle: ticks to quiescence, final water count
    result_fields: |-
      `ticks_to_settle`, `quiet`, `water_final`, `chunk_count`
    envs: '`AWECRAFT_SETTLE_TICKS`'
    wall: ~10–20 s (not re-run 08-24)
    notes: ''
  buckets:
    entry: |-
      `_buckets_test` (`_buckets_test_body` in battery)
    tests: bucket scoop water → item 140, place back
    result_fields: |-
      `scoop_before`, `after_scoop`, `inv_scoop`, `place_after`, `inv_place`
    envs: —
    wall: |-
      ~5 s (standalone, not re-run 08-24) / ~3 s battery
    notes: battery full mode (not in 08-24 smoke)
  water:
    entry: '`_water_test`'
    tests: |-
      player water-column physics: rise to shore top, land on shore, water cell intact
    result_fields: |-
      `B`, `shore_top`, `timeline`, `max_y`, `first_above_frame`, `above_top`, `landed_frame`, `standing_on_shore`, `final`, `final_on_floor`, `water_cell_intact`, `ok`
    envs: —
    wall: ~20 s (not re-run 08-24)
    notes: ''
  fpv:
    entry: '`_fpv_test`'
    tests: |-
      first-person view atlas UVs in range, grass top/side distinct
    result_fields: |-
      `has_uv`, `uv_min`, `uv_max`, `uv_in_range`, `grass_top`, `grass_side`, `grass_distinct`
    envs: —
    wall: ~5 s (not re-run 08-24)
    notes: ''
  held:
    entry: '`_held_test`'
    tests: |-
      held block box vs cross sprite visibility (AC-0066 fidelity)
    result_fields: |-
      `ok`, `block_held_ok`, `block_visible`, `block_type_ok`, `sprite_hidden_during_block`, `region_actual`, `region_want`, `tool_held_ok`, `tool_visible`, `tool_type_ok`, `empty_hidden_ok`
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: ''
  toolres:
    entry: '`_toolres_test`'
    tests: |-
      tool voxel model resolution: 5 tools present + type + tier color + box/fist fallback
    result_fields: |-
      `ok`, `tool_111`/`115`/`119`/`123`/`113` {`present`,`type`,`fist`,`sprite`,`box`,`ok`}, `headcolor_111`/`headcolor_113`, `tier_differs_111_vs_113`, `box_after_tool`, `fist_after_empty`
    envs: —
    wall: ~10 s (not re-run 08-24)
    notes: AC-0070 gate
  toolpose:
    entry: '`_toolpose_test`'
    tests: |-
      tool orientation + scale ×2 + depth-disable (AC-0073/0067/0085)
    result_fields: |-
      `ok`, `held_box_scale_x` (≈0.70), `held_sprite_scale_x`, `scale_ok`, `tool_…` {`position_ok`,`arc_ok`,`vertical_ok`,`handle_below_cam`,`bbox_diag`,`diag_2x_ok`,`depth_disabled`,`ok`}, `depth` {tool,box,fist,sprite}, `depth_ok`
    envs: —
    wall: ~15 s (not re-run 08-24)
    notes: handle y < −0.55
  viewmodel:
    entry: '`_viewmodel_shot`'
    tests: |-
      AC-0085 render hook: idle/apex head+handle centroids for a held tool
    result_fields: |-
      `vmshot`, `frac`, `idle_head`, `idle_handle`, `apex_head`, `apex_handle`
    envs: |-
      `AWECRAFT_VMITEM`, `AWECRAFT_VMSHOT`, `AWECRAFT_VMFRACTION`
    wall: ~10 s headless (render hook; xvfb for the shot)
    notes: centroid-only in headless
  wallshot:
    entry: '`_wallshot_test`'
    tests: |-
      AC-0067 on-top: held box/sprite vs stone wall pixel regions (before/after)
    result_fields: |-
      `before`, `shots`, `wall_face_z`, `block` {`block_frame_stone`,`block_vm_nonstone`,`block_box_vis`,`block_depth_on`}, `item` {`item_vm_cyan`,`item_sprite_vis`}
    envs: |-
      `AWECRAFT_WALL_BEFORE` (1), `AWECRAFT_WALL_SHOTS`, `AWECRAFT_SNAPSHOT` (paths)
    wall: render mode (~300 s timeout)
    notes: xvfb; writes shots into `tasks/AC-0067/`
  editperf:
    entry: '`_editperf_test`'
    tests: |-
      single block edit: flush frames, build cost, no hitch
    result_fields: |-
      `cell`, `edited_id`, `cell_after`, `flush_done`, `flush_frames`, `max_frame_build_ms`, `single_build_ms`, `total_ms`
    envs: —
    wall: ~5–10 s (not re-run 08-24)
    notes: ''
  perf:
    entry: '`_perf_test`'
    tests: |-
      full-radius build/drain/first-draw/frame percentiles + memory
    result_fields: |-
      `chunks`, `render_radius`, `fog_near`/`fog_far`/`fog_edge`/`fog_ok`, `total_chunks`, `all_meshed`, `collision_shapes`, `collision_ms_total`, `collision_n`, `collision_max_ms`, `collision_slabs`, `collision_slab_ms`, `collision_slab_max_ms`, `collision_slab_hist` (ms bins lt1/1_2/2_5/5_10/10_25/gte25), `reband_exit`, `reband_entry`, `reband_rearm_slabs`, `staged_drained`, `staged_dropped`, `col_deferred` (AC-0340 debt census), `col_deferred_in_footprint` (AC-0340 fence tripwire — 0), `footprint` {`cols`, `missing`} (AC-0340 arm-side fence scan — 0), `total_ms`, `frames`, `recenter_ms`, `max_frame_ms`, `build_units`, `drain_frames`, `max_drain_ms`, `gen_ms`, `build_ms`, `first_draw_ms`, `p50_ms`, `p95_ms`, `frame_max_ms`, `mem_before_bytes`, `mem_after_bytes`, `drain_s`
    envs: |-
      `AWECRAFT_RADIUS`, `AWECRAFT_THREADGEN_N`/`TGDEBUG`, `AWECRAFT_RECPROBE`, `AWECRAFT_DRAIN_MS`, `AWECRAFT_COLLIDE_MS` (AC-0340 staged collision cap, default 8 ms), `AWECRAFT_GEN_BUDGET`, `AWECRAFT_MESH_INFO`
    wall: |-
      r4 ≈12.3 s total_ms (measured `.scratch/ac0082_g4_perf_r4_t1.log` 2026-08-24); **r50 ≈850 s total_ms (from 2026-08-24 03:25 log `ac0082_g4_perf_r50_t1.log`)**
    notes: |-
      SLOW at r50 — use 3000 s timeout. **AC-0340: the per-frame collision budget (collide_drain_budget_ms, default 8 ms — the drain_budget_ms model) caps the staged lane; `col_deferred` counts budget-deferred (re-queued) columns, `col_deferred_in_footprint` the FENCE tripwire (must be 0), and `footprint` is the arm-side scan of the immediate footprint (Chebyshev ≤ 1 of the anchor + (0,0)) for meshed slabs missing a body (must be 0 — the "player falls through" class). `collision_n`/`collision_max_ms` now count PARTIAL batches (a column split across frames is 2+ batches, each ≤ budget); `collision_ms_total` and the per-slab census are invariant**
  boundary:
    entry: '`_boundary_test` (via `_await_boundary_core`)'
    tests: |-
      chunk streaming: walk r chunks, crossings, bursts, forward/trailing wall, mem, marker round-trip
    result_fields: |-
      `ok`, `radius`, `walk_chunks`, `walk_speed`, `walk_s`, `crossings`, `p50_ms`, `p95_ms`, `max_ms`, `loads`, `unloads`, `flap`, `burst_ms_per_crossing`, `burst_p50_ms`, `burst_p95_ms`, `burst_max_ms`, `forward_wall_ms_per_crossing`, `forward_p95_ms`, `forward_max_ms`, `trailing_*`, `fluid_tick_ms_p95`, `mem_delta_mb`, `marker`, `marker_ok`, `remesh_ok`, `resident_final`, `built_final`, `in_radius_built_final`/`_max`/`_min`, `in_radius_present_final`, `target_in_radius`, `collision_ms_total`, `collision_n`, `collision_max_ms`, `collision_slabs`, `collision_slab_ms`, `collision_slab_max_ms`, `collision_slab_hist` (ms bins lt1/1_2/2_5/5_10/10_25/gte25), `reband_exit`, `reband_entry`, `reband_rearm_slabs`, `staged_drained`, `staged_dropped`, `col_deferred` (AC-0340 debt census), `col_deferred_in_footprint` (AC-0340 fence tripwire — 0), `footprint` {`cols`, `missing`} (AC-0340 arm-side fence scan — 0), `unbodied_built_final`, **AC-0348 crossing attribution (FRAME-LATENCY fields — never gate frame smoothness on the `burst_*` throughput fields above)**: `crossing_n` (the cross>0 ring entries over the walk), `crossing_other_n` (the cross==0 entries — snap-backs/Y recenters), `crossing_burst_ms` (list) + `crossing_burst_p50_ms`/`crossing_burst_p95_ms`/`crossing_burst_max_ms` (the SYNCHRONOUS recenter() sweep wall, from the world crossing ring `world.crossing_ring`), `crossing_frame_ms` (list) + `crossing_frame_p50_ms`/`crossing_frame_p95_ms`/`crossing_frame_max_ms` (the frame time OF the frame each crossing ran on — the GATE fields), `crossing_census` {`demoted`, `gen_far`, `promoted`, `halo_evicts`, `reentry_flips`, `scanned`} (per-crossing cause totals), `crossing_worst` {`seq`, `us_ms`, `scan_ms`, `frame_ms`, `cross`, `ahead`, `scanned`, `demoted`, `gen_far`, `promoted`, `halo_evicts`, `reentry_flips`} (the max-sweep entry — the tail's named owner), **AC-0352 storm-tail attribution (the worst-frame class — the fields the standing R24 row gates on)**: `storm_walk_n` (walk frames over the 30 ms capture threshold), `storm_walk_p99_ms` (the p99 of the WALK frame list — the GATED worst-frame field; the percentile, stable across runs), `storm_walk_max_ms` (single-sample by nature — documented, NOT the gate), `storm_threshold_ms` (30 — the capture threshold), `wfc_total_n` (all over-threshold frames since boot — the load storm included), `wfc_boot_n` (the pre-walk share of that), `worst_frames` (list, worst 20 captured entries inside the walk window, each {`t_ms`, `ms`, `split` (13-slot stage split in ms: drain/low/handoff/io/recenter/misc + facelight/rescore/meshattach/low_poll/star/collide), `state` (queue/tm/tg/low/star/resident/inr_present/inr_built), `edit` (dispatches/defers/syncs cumulative + dirty_depth + remesh_depth + act_window/dirty_max_window/remesh_max_window — the re-mesh correlation lead)}), `census_walk_start`/`census_walk_end` {`tree_nodes`, `tree_mi`, `collision_bodies`, `resident`} (the blind-spot census — the instance-level ground for the costs outside `World._process`; headless has no rasterizer so draw-call counters are meaningless there)
    envs: |-
      `AWECRAFT_RADIUS` (r), `AWECRAFT_WALK`, `AWECRAFT_WALK_SPEED`, `AWECRAFT_TICKTIME`, `AWECRAFT_THREADGEN_N`/`TGDEBUG`, `AWECRAFT_RECPROBE`
    wall: |-
      r3 45 s, r4 46 s (measured 2026-08-24); r50 ≈1400 s wall (from 2026-08-24 10:34 log `.scratch/ac0079r3_battery/b_r50.log`); r24 ≈20 min wall (AC-0348, WALK=10 — the initial streaming storm dominates, the walk itself is ~10 s) — **AC-0352 (2026-09-23, post-AC-0356 tree): the stale 20-min estimate does not hold uniformly — AC-0356's post-fix run read ~130 s, this ticket's two WALK=10 runs read ~850 s on the dsh-web cgroup box; the wall is the frame-based settle/retreat loops scaled by the storm's slow frames (timeout 2400 s covers all readings; RSS-sample the run — the storm is flat at ~1.0–1.3 GB)**
    notes: |-
