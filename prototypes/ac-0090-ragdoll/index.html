<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AC-0090 — three.js procedural ragdoll characters</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Prototype page for AweCraft ticket AC-0090.

  Offline by construction: three.js is vendored under ./vendor/three and the
  import map points at it, so the page needs no network, no bundler, no
  node_modules and no build step. ES modules cannot be loaded from file://, so
  serve the repository root over HTTP and open /prototypes/ac-0090-ragdoll/.
  See README.md for the one-line server command.
-->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%237fd6a6'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1018; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a1018; color: #7d90a4; font: 13px ui-sans-serif, system-ui, sans-serif;
    z-index: 100; transition: opacity .4s;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  #error {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    max-width: 640px; background: #2a1418; border: 1px solid #7a2f38; color: #ffd7dc;
    font: 12px/1.5 ui-monospace, Menlo, monospace; padding: 14px 16px; border-radius: 8px;
    white-space: pre-wrap; z-index: 200; display: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/": "./vendor/three/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="boot">generating characters…</div>
<pre id="error"></pre>
<script type="module">
  const boot = document.getElementById('boot');
  const err = document.getElementById('error');
  const fail = (e) => {
    err.style.display = 'block';
    err.textContent = 'AC-0090 failed to start:\n' + (e && e.stack ? e.stack : String(e));
    boot.classList.add('done');
    window.__AC0090_ERROR = String(e && e.message ? e.message : e);
  };
  window.addEventListener('error', (ev) => fail(ev.error || ev.message));
  window.addEventListener('unhandledrejection', (ev) => fail(ev.reason));
  try {
    const { boot: start } = await import('./src/main.js');
    await start();
    boot.classList.add('done');
    window.__AC0090_LOADED = true;
  } catch (e) {
    fail(e);
  }
</script>
</body>
</html>
