document.addEventListener('pointerlockchange',()=>{
  if(document.pointerLockElement===canvas){
    if(state==='pause'||state==='menu'){
      state='play';
      pauseEl.classList.add('hidden');
      menuEl.classList.add('hidden');
    }
  }else{
    if(state==='play'&&!uiMode&&!player.dead){
      state='pause';
      mining=false;
      pauseEl.classList.remove('hidden');
    }
  }
});
canvas.addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==canvas)return;
  player.yaw-=e.movementX*0.0022;
  player.pitch-=e.movementY*0.0022;
  player.pitch=THREE.MathUtils.clamp(player.pitch,-1.55,1.55);
});
canvas.addEventListener('mousedown',e=>{
  if(document.pointerLockElement!==canvas||state!=='play'||uiMode)return;
  if(e.button===0)startMine();
  else if(e.button===2)doPlaceOrInteract();
  else if(e.button===1){e.preventDefault();pickBlock()}
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mouseup',e=>{if(e.button===0)mining=false});
canvas.addEventListener('wheel',e=>{
  if(state!=='play'||uiMode)return;
  player.sel=(player.sel+(e.deltaY>0?1:-1)+9)%9;
  renderHotbar();
},{passive:true});
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyE'){
    if(state==='play'){
      if(uiMode)closeUI();
      else{openUI('inv');document.exitPointerLock()}
    }
  }
  if(e.code==='Escape'&&uiMode)closeUI();
  if(e.code==='F3'){showF3=!showF3;e.preventDefault()}
  if(e.code==='KeyF'&&state==='play'&&!uiMode&&!player.dead){
    player.flying=!player.flying;
    player.fallStart=null;
    showMsg(player.flying?'Flying':'Landed');
  }
  if(e.code==='KeyG'&&world&&!player.dead){
    if(isNight){time=0.5;showMsg('Noon')}
    else{time=0.0;showMsg('Midnight')}
  }
  if(state==='play'&&!uiMode&&e.code.indexOf('Digit')===0){
    const n=+e.code.slice(5);
    if(n>=1&&n<=9){player.sel=n-1;renderHotbar()}
  }
  if(e.code==='Space')e.preventDefault();
});
addEventListener('keyup',e=>keys[e.code]=false);
async function applyTexturePack(file){
  if(!file)return;
  if(!window.JSZip){showMsg('JSZip failed to load (needs internet for CDN)');return}
  try{
    const zip=await JSZip.loadAsync(await file.arrayBuffer());
    let base='';
    if(!zip.file('pack.mcmeta')&&zip.file('resource_pack/pack.mcmeta'))base='resource_pack/';
    const entries={};
    zip.forEach((path,f)=>{entries[path]=f});
    const blocksPng=entries[base+'assets/minecraft/textures/blocks.png'];
    const itemsPng=entries[base+'assets/minecraft/textures/items.png'];
    let blocksImg=null,itemsImg=null;
    if(blocksPng)blocksImg=await zipImage(blocksPng);
    if(itemsPng)itemsImg=await zipImage(itemsPng);
    let count=0;
    ANIM.length=0;
    for(const k in PACK_MAP){
      const tile=+k,m=PACK_MAP[k];
      let done=false;
      for(const p of m.new){
        const e=entries[base+'assets/minecraft/textures/'+p+'.png'];
        if(e){
          try{
            const im=await zipImage(e);
            drawTileToAtlas(tile,im);
            count++;done=true;
            if(im.height>im.width&&im.height>=im.width*4){
              const a=await findAnimJson(base,entries,'assets/minecraft/textures/'+p);
              let src=im;
              const nt=NEUTRAL_TINTS[k];
              if(nt)src=neutralTintImage(im,nt[0],nt[1],nt[2])||im; // tint animated source so frames stay tinted
              drawTileToAtlas(tile,src);
              ANIM.push({tile,img:src,sw:src.width,fh:src.width,frames:a?a.frames:null,frametime:a?a.frametime:300,t:0,last:-1});
            }else{
              const nt=NEUTRAL_TINTS[k];
              if(nt)bakeNeutralTint(tile,nt[0],nt[1],nt[2]);
            }
          }catch(err){}
          break;
        }
      }
      if(!done&&m.old){
        const src=m.old[2]==='b'?blocksImg:itemsImg;
        if(src){drawRegionToAtlas(tile,src,m.old[0],m.old[1]);count++}
      }
    }
    atlasTex.needsUpdate=true;
    refreshAtlasUI();
    for(const d of drops){
      const c=document.createElement('canvas');c.width=TILE;c.height=TILE;
      const cx2=c.getContext('2d');
      const ic=ITEMS[d.id].icon;
      cx2.drawImage(atlasCanvas,(ic&15)*TILE,((ic>>4)&15)*TILE,TILE,TILE,0,0,TILE,TILE);
      d.mesh.material.map.image=c;
      d.mesh.material.map.needsUpdate=true;
    }
    const icon=entries[base+'pack.png']||entries[base+'pack_icon.png'];
    if(icon){
      const im=await zipImage(icon);
      const pi=$('pack-icon');
      pi.src=im.src;
      pi.classList.remove('hidden');
    }
    showMsg('Texture pack loaded: '+count+' textures');
  }catch(e){
    showMsg('Pack load failed: '+e.message);
  }
}
$('pack-file').addEventListener('change',e=>{
  applyTexturePack(e.target.files[0]);
  e.target.value='';
});
$('btn-pack').addEventListener('click',()=>$('pack-file').click());
$('btn-continue').addEventListener('click',()=>{
  if(loadGame()){
    menuEl.classList.add('hidden');
    state='play';
    canvas.requestPointerLock();
  }else{
    localStorage.removeItem(CFG.SAVE_KEY);
    $('btn-continue').classList.add('hidden');
  }
});
$('btn-new').addEventListener('click',()=>{
  newWorld($('seed-input').value);
  menuEl.classList.add('hidden');
  state='play';
  canvas.requestPointerLock();
});
$('btn-resume').addEventListener('click',()=>{
  pauseEl.classList.add('hidden');
  state='play';
  canvas.requestPointerLock();
});
$('btn-save').addEventListener('click',()=>saveGame(false));
$('btn-quit').addEventListener('click',()=>{
  saveGame(true);
  pauseEl.classList.add('hidden');
  menuEl.classList.remove('hidden');
  state='menu';
});
$('btn-respawn').addEventListener('click',()=>{
  deadEl.classList.add('hidden');
    player.dead=false;
    player.hp=20;player.air=10;player.flying=false;
    player.hunger=20;player.armor=[null,null,null,null];
    const sx=Math.floor(player.pos.x),sz=Math.floor(player.pos.z);
  world.ensureChunk(sx>>4,sz>>4);
  let sy=CFG.HEIGHT-2;
  while(sy>1&&!isSolid(sx,sy,sz))sy--;
  player.pos.set(sx+0.5,sy+1.01,sz+0.5);
  player.vel.set(0,0,0);
  renderHearts();
  state='play';
  canvas.requestPointerLock();
});

// ============================================================
// GAME LOOP / BOOT
// ============================================================
let autoSaveT=0,regenT=0,starveT=0;
let last=performance.now();
let frames=0;
window.__loopErr=null;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000;
  last=now;
  if(dt>0.05)dt=0.05;
  frames++;
  try{
  if(world&&(state==='play'||state==='pause'||state==='dead')){
    updateSky(dt);
    tickFluids(dt);
    updateWorldStreaming();
    updateAtlasAnims(dt);
    litUniforms.value=dayFactor;
  }
  if(world&&state==='play'&&!player.dead){
    updatePlayer(dt);
    updateMining(dt);
    updateMobs(dt);
    updateProjectiles(dt);
    updateDrops(dt);
    updateSpawning(dt);
    processPaths();
    updateFurnaces(dt);
    autoSaveT+=dt;
    if(autoSaveT>30){autoSaveT=0;saveGame(true)}
    if(!player.flying&&player.onGround&&(keys.ShiftLeft||keys.ShiftRight))
      player.hunger=Math.max(0,player.hunger-dt*0.06);
    if(player.hunger>18&&player.hp<20){
      regenT+=dt;
      if(regenT>=2){regenT=0;player.hp=Math.min(20,player.hp+1);renderHearts()}
    }else regenT=0;
    if(player.hunger<=0){
      starveT+=dt;
      if(starveT>=4){starveT=0;damagePlayer(1,'starve')}
    }else starveT=0;
  }
  camera.position.set(player.pos.x,player.pos.y+CFG.EYE,player.pos.z);
  camera.rotation.set(player.pitch,player.yaw,0);
  window.__stars.position.copy(camera.position);
  if(msgT>0){msgT-=dt;if(msgT<=0)msgEl.style.opacity=0}
  if(showF3&&world){
    fps=fps*0.9+(1/Math.max(dt,0.001))*0.1;
    f3El.classList.remove('hidden');
    const ll=lightAt(Math.floor(player.pos.x),Math.floor(player.pos.y+CFG.EYE),Math.floor(player.pos.z));
    f3El.textContent=
      'AweCraft['+BUILD+']  '+fps.toFixed(0)+' fps\n'+
      'pos '+player.pos.x.toFixed(1)+' '+player.pos.y.toFixed(1)+' '+player.pos.z.toFixed(1)+'\n'+
      'chunk '+(Math.floor(player.pos.x/16))+','+(Math.floor(player.pos.z/16))+'\n'+
      'chunks '+world.chunks.size+'  mobs '+mobs.length+'  drops '+drops.length+(player.flying?'  FLY':'')+'\n'+
      'time '+((time*24).toFixed(1))+'h  '+(isNight?'night':'day')+'  seed '+world.seed+
      (world.type?'  ['+world.type+']':'')+'\n'+
      'light sky='+ll[0]+'/'+15+' blk='+ll[1]+'/'+15+'  day='+dayFactor.toFixed(2);
  }else f3El.classList.add('hidden');
  renderer.render(scene,camera);
  }catch(err){
    window.__loopErr=err.message+' @ '+err.stack.split('\n')[1];
  }
}
window.__debug={
  get build(){return BUILD},
  get world(){return world},
  get player(){return player},
  get frames(){return frames},
  get time(){return time},
  setTime:(t)=>{time=t%1},
  aStar:(sx,sy,sz,tx,ty,tz)=>aStar(sx,sy,sz,tx,ty,tz),
  standable:(x,y,z)=>standable(x,y,z),
  get loopErr(){return window.__loopErr},
  get mobs(){return mobs},
  get drops(){return drops},
  get projectiles(){return projectiles},
  count:(id)=>countItem(id),
  spawnArrow,
  get state(){return state},
  setBlock:(x,y,z,id)=>world.setBlock(x,y,z,id),
  addItem:(id,n)=>addItem(id,n),
  save:()=>saveGame(false),
  load:()=>loadGame(),
  atlas:(t)=>{
    const px=atlasCanvas.getContext('2d').getImageData((t&15)*TILE+(TILE>>1),((t>>4)&15)*TILE+(TILE>>1),1,1).data;
    return[px[0],px[1],px[2],px[3]];
  },
  atlasPx:(t,x,y)=>{
    const px=atlasCanvas.getContext('2d').getImageData((t&15)*TILE+x,((t>>4)&15)*TILE+y,1,1).data;
    return[px[0],px[1],px[2],px[3]];
  },
  glVer:()=>renderer.getContext().getParameter(renderer.getContext().VERSION),
  get anims(){return ANIM.map(a=>({tile:a.tile,frames:Math.floor(a.img.height/a.fh),frametime:a.frametime,t:Math.floor(a.t),last:a.last}))},
  rebuild:(cx,cz)=>{const c=world.getChunk(cx,cz);updateChunkMesh(c);return 'ok'},
  blockAt:(x,y,z)=>world.block(x,y,z),
  lightAt:(x,y,z)=>lightAt(x,y,z),
  light:(cx,cz)=>{computeChunkLight(cx,cz);return 'ok'},
  faceDebug:(lx,y,lz)=>{
    const c=world.getChunk(0,0);
    const id=c.data[(y<<8)+(lz<<4)+lx];
    const b=BLOCKS[id];
    const out={id,faces:[]};
    for(let f=0;f<6;f++){
      const F=FACES[f];
      const nid=world.block(lx+F.n[0],y+F.n[1],lz+F.n[2]);
      const nb=BLOCKS[nid];
      out.faces.push({f,nid,culled:(nid===id)||(nb&&nb.solid&&!nb.cutout)});
    }
    return out;
  },
  meshStats:()=>{
    const c=world.getChunk(0,0);
    if(!c||!c.mesh)return null;
    const g=c.mesh.geometry;
    const a=g.index.array;
    let mx=0;for(let i=0;i<a.length;i++)if(a[i]>mx)mx=a[i];
    return{verts:g.attributes.position.count,idx:a.length,idxType:a.constructor.name,maxIdx:mx,
      uvs:g.attributes.uv.count,cols:g.attributes.color.count};
  },
   newWorld:(s)=>newWorld(s),
   breakBlock,
   spawnMob:(t,x,y,z)=>{const m=new Mob(t,x,y,z);mobs.push(m);return m},
   setFluid:(x,y,z,id,lvl)=>world.setFluid(x,y,z,id,lvl,false),
   fluidAt:(x,y,z)=>[world.block(x,y,z),world.fluidLevel(x,y,z)],
   tickFluids:()=>{fluidTickT=0;tickFluids(0.3)},
   terrainHeight:(x,z)=>terrainHeight(x,z),
};
buildHotbar();
renderHearts();
if(hasSave())$('btn-continue').classList.remove('hidden');
requestAnimationFrame(loop);
</script>
